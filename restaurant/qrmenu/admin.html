<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com; style-src 'self' file: 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; frame-src https://challenges.cloudflare.com; connect-src https://xmsghzhlybiakfmyypek.supabase.co https://challenges.cloudflare.com; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>Digiconvo SaaS Super Admin — Multi-City HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>preventFraming();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif;}
body{background:#05070f;color:#fff;min-height:100vh;padding:26px;}
.container{max-width:1280px;margin:auto;}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding-bottom:20px;border-bottom:1px solid #1f2940;margin-bottom:24px;}
.header h1{font-size:25px;color:#c5a880;}
.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px;margin-bottom:20px;}
.statCard{background:#0b0f19;border:1px solid #24304d;border-radius:16px;padding:16px 18px;}
.statCard h4{color:#94a3b8;font-size:12px;margin-bottom:6px;}
.statCard h2{font-size:26px;color:#c5a880;}

.cityBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:12px 14px;background:#0b0f19;border:1px solid #1f2940;border-radius:14px;align-items:center;}
.cityBarLabel{font-size:11.5px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin-right:4px;}
.cityPill{background:#141b2d;border:1px solid #293552;color:#cbd5e1;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.cityPill.active{background:#c5a880;color:#05070f;border-color:#c5a880;}
.cityPill span{opacity:.8;font-weight:600;font-size:11px;}

.primaryBtn{background:#c5a880;color:#05070f;border:none;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;}
.secondaryBtn{background:#141b2d;color:#fff;border:1px solid #293552;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}

.tenantGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;}
.tenantCard{background:#0b0f19;border:1px solid #24304d;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.tenantCard.paused{border-color:#7f1d1d;opacity:0.82;}
.tenantCard.expiring{border-color:#d97706;}
.statusPill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;}
.pillActive{background:#14532d;color:#4ade80;}
.pillPaused{background:#7f1d1d;color:#fca5a5;}
.pillExpired{background:#7f1d1d;color:#fca5a5;}
.pillExpiring{background:#78350f;color:#fbbf24;}
.tenantCard.expired{border-color:#7f1d1d;}
.locBadge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;background:#141b2d;border:1px solid #293552;color:#cbd5e1;font-size:11px;font-weight:600;}

.pagerBar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid #1f2940;font-size:13px;color:#94a3b8;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalBox{width:680px;max-width:100%;background:#0b0f19;border:1px solid #24304d;border-radius:18px;padding:24px;max-height:90vh;overflow-y:auto;}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.formGrid label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:700;}
.formGrid input:not([type="checkbox"]),.formGrid select{width:100%;padding:11px;border-radius:10px;border:1px solid #293552;background:#141b2d;color:#fff;}
.full{grid-column:1/3;}
.slugRow{display:flex;gap:8px;}
.slugRow input{flex:1;}

#masterLogin{position:fixed;inset:0;background:#05070f;display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:#0b0f19;border:1px solid #24304d;border-radius:18px;padding:34px;max-width:390px;width:100%;text-align:center;}
.loginCard input{width:100%;padding:13px;border-radius:10px;border:1px solid #293552;background:#141b2d;color:#fff;margin:14px 0 10px;text-align:center;font-size:16px;}
.turnstileSlot{display:none;justify-content:center;margin:10px 0 12px;min-height:65px;}

:focus-visible{outline:2px solid #c5a880;outline-offset:2px;}
button:disabled{opacity:.55;cursor:wait!important;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.toolbar input,.toolbar select{background:#0b0f19;border:1px solid #293552;color:#fff;padding:10px 13px;border-radius:10px;min-width:190px;}
#masterMsg{min-height:18px;color:#f87171;font-size:13px;margin:4px 0 10px;}
@media(max-width:640px){.formGrid{grid-template-columns:1fr;}.full{grid-column:auto;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<body>

<div id="masterLogin" role="dialog" aria-modal="true" aria-label="Super admin login">
    <div class="loginCard">
        <i class="fa-solid fa-crown" style="font-size:38px;color:#c5a880;margin-bottom:12px;" aria-hidden="true"></i>
        <h2>SaaS Master Control</h2>
        <p id="masterSubtitle" style="font-size:13px;color:#94a3b8;margin-top:4px;">Enter Master Key & Security Code</p>
        <input type="password" id="masterSecretInput" placeholder="••••••••••••" autocomplete="current-password" aria-label="Master key" onkeydown="if(event.key==='Enter'){if(isTurnstileEnabled())unlockMaster();else $('masterCaptchaInput').focus();}">
        <div id="masterFallbackCaptcha">
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;">
                <canvas id="masterCaptchaCanvas" width="165" height="44" style="border-radius:10px;border:1px solid #293552;background:#141b2d;"></canvas>
                <button type="button" class="secondaryBtn" style="padding:10px 12px;" title="New Code" onclick="generateMasterCaptcha()"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <input type="text" id="masterCaptchaInput" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" autocomplete="off" style="margin:0 0 10px;font-size:18px;letter-spacing:4px;" onkeydown="if(event.key==='Enter')unlockMaster()">
        </div>
        <div id="masterTurnstile" class="turnstileSlot"></div>
        <div id="masterMsg" role="alert"></div>
        <button class="primaryBtn" id="masterBtn" style="width:100%;" onclick="unlockMaster()">Unlock HQ</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <h1><i class="fa-solid fa-crown" aria-hidden="true"></i> Digiconvo Multi-City Super Admin</h1>
            <p style="color:#94a3b8;font-size:13px;margin-top:4px;">Multi-City Scale • Server-Side Pagination • Hardened RLS • Turnstile Ready</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="secondaryBtn" onclick="openMasterSecurityModal()"><i class="fa-solid fa-key" aria-hidden="true"></i> Security & Billing Settings</button>
            <button class="primaryBtn" onclick="openTenantModal()"><i class="fa-solid fa-plus" aria-hidden="true"></i> Onboard New Restaurant</button>
            <button class="secondaryBtn" onclick="logoutMaster()"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Logout</button>
        </div>
    </div>

    <div class="statsGrid" id="saasStats"></div>
    <div class="cityBar" id="cityBar" style="display:none;"></div>

    <div class="toolbar">
        <input id="tenantSearch" type="search" placeholder="Search name, slug, city, area, owner..." aria-label="Search restaurants" oninput="onSearchInput()">
        <select id="cityFilter" aria-label="Filter by city" onchange="onFilterChange()">
            <option value="">All Cities</option>
        </select>
        <select id="tenantFilter" aria-label="Filter by status" onchange="onFilterChange()">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="expiring">Expiring within 5 days</option>
            <option value="expired">Expired</option>
            <option value="paused">Paused</option>
        </select>
        <select id="tenantSort" aria-label="Sort restaurants" onchange="onFilterChange()">
            <option value="newest">Newest first</option>
            <option value="expiry">Expiry: soonest first</option>
            <option value="name">Name A-Z</option>
            <option value="scans">Most scans</option>
        </select>
    </div>

    <div class="tenantGrid" id="tenantGrid"></div>
    <div class="pagerBar" id="pagerBar" style="display:none;"></div>
</div>

<div class="modal" id="tenantModal" role="dialog" aria-modal="true" aria-label="Restaurant editor">
    <div class="modalBox">
        <h3 id="modalTitle" style="color:#c5a880;font-size:20px;">Onboard New Restaurant</h3>
        <div class="formGrid">
            <div><label for="tName">Restaurant Name</label><input id="tName" maxlength="80" placeholder="Spice Garden Cafe"></div>
            <div><label for="tCity">City</label><input id="tCity" maxlength="60" placeholder="Indore"></div>
            <div><label for="tState">State / Region</label><input id="tState" maxlength="60" placeholder="Madhya Pradesh"></div>
            <div><label for="tArea">Area / Locality</label><input id="tArea" maxlength="80" placeholder="Vijay Nagar"></div>
            <div class="full">
                <label for="tSlug">URL Slug (e.g. spicegarden-indore)</label>
                <div class="slugRow">
                    <input id="tSlug" maxlength="40" placeholder="spicegarden-indore">
                    <button type="button" id="suggestSlugBtn" class="secondaryBtn" onclick="suggestCitySlug()">Suggest Slug</button>
                </div>
            </div>
            <div><label for="tTagline">Tagline</label><input id="tTagline" maxlength="120" placeholder="Fresh Food & Great Vibes"></div>
            <div><label id="pinLabel" for="tPin">Set Admin PIN</label><input type="password" id="tPin" maxlength="12" autocomplete="new-password" placeholder="Enter new PIN to set/reset"></div>
            <div><label for="tOwner">Owner Name</label><input id="tOwner" maxlength="80" placeholder="Owner Name"></div>
            <div><label for="tPhone">Owner Billing Phone / WhatsApp</label><input id="tPhone" maxlength="20" inputmode="tel" placeholder="919876543210"></div>
            <div><label for="tCustomerWA">Customer Order WhatsApp (optional, defaults to owner phone on create)</label><input id="tCustomerWA" maxlength="20" inputmode="tel" placeholder="Leave blank to keep/default"></div>
            <div>
                <label for="tTz">Timezone</label>
                <select id="tTz">
                    <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                    <option value="Asia/Dubai">Asia/Dubai (GST)</option>
                    <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
                    <option value="Asia/Kathmandu">Asia/Kathmandu (NPT)</option>
                    <option value="Asia/Dhaka">Asia/Dhaka (BST)</option>
                    <option value="Europe/London">Europe/London (GMT/BST)</option>
                    <option value="America/New_York">America/New_York (EST/EDT)</option>
                </select>
            </div>
            <div><label for="tPlan">Monthly Subscription (₹)</label><input type="number" id="tPlan" min="0" step="any" value="399"></div>
            <div><label for="tValid">Valid Till Date</label><input type="date" id="tValid"></div>
            <div>
                <label for="tTheme">Theme Color Preset</label>
                <select id="tTheme">
                    <option value="gold">✨ Royal Gold</option>
                    <option value="emerald">🌿 Pure Veg Emerald</option>
                    <option value="crimson">🔥 Cafe Terracotta</option>
                    <option value="royal">🌊 Ocean Blue</option>
                    <option value="plum">🍷 Velvet Plum</option>
                </select>
            </div>
            <div><label for="tAddress">Restaurant Address</label><input id="tAddress" maxlength="300" placeholder="Main Road..."></div>
            <div class="full" id="cloneWrap" style="margin-top:6px;">
                <label style="display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer;">
                    <input type="checkbox" id="tClone" checked style="width:18px;height:18px;accent-color:#c5a880;">
                    Pre-load Demo Menu Starter Pack (9 Dishes)
                </label>
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
            <button class="secondaryBtn" onclick="closeOverlay('tenantModal')">Cancel</button>
            <button class="primaryBtn" onclick="saveTenant(this)">Save Restaurant</button>
        </div>
    </div>
</div>

<div class="modal" id="securityModal" role="dialog" aria-modal="true" aria-label="Security and billing settings">
    <div class="modalBox">
        <h3 style="color:#c5a880;font-size:20px;">🔑 Master Key & Renewal Settings</h3>
        <p style="font-size:12.5px;color:#94a3b8;margin-top:4px;">Your Master Key is stored hashed in Supabase and never in code.</p>
        <div class="formGrid">
            <div class="full">
                <label for="mNewSecret">New Master Key (leave blank to keep the current key)</label>
                <input type="password" id="mNewSecret" autocomplete="new-password" placeholder="At least 8 characters">
            </div>
            <div class="full">
                <label for="mNewSecret2">Confirm New Master Key</label>
                <input type="password" id="mNewSecret2" autocomplete="new-password" placeholder="Re-enter the new Master Key">
            </div>
            <div class="full">
                <label for="mCurrentSecret">Current Master Key (required only when changing the key)</label>
                <input type="password" id="mCurrentSecret" autocomplete="current-password" placeholder="Type your current Master Key">
            </div>
            <div><label for="mProviderWA">Your Personal WhatsApp (For Owner Renewal Button)</label><input id="mProviderWA" inputmode="tel" placeholder="e.g. 919876543210"></div>
            <div><label for="mProviderUpi">Your UPI ID (Optional)</label><input id="mProviderUpi" placeholder="e.g. yourname@upi"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
            <button class="secondaryBtn" onclick="closeOverlay('securityModal')">Cancel</button>
            <button class="primaryBtn" onclick="saveMasterConfig(this)">Update Security Settings</button>
        </div>
    </div>
</div>

<script>
let TENANTS = [];
let CITIES = [];
let STATS = {};
let TOTAL_MATCHING = 0;
let PAGE_LIMIT = 50;
let PAGE_OFFSET = 0;
let PROVIDER_WA = "";
let PROVIDER_UPI = "";
let MASTER_CAPTCHA = "";
let MASTER_TS_WIDGET = null;
let MASTER_TS_TOKEN = "";

const $ = id => document.getElementById(id);

function generateMasterCaptcha() {
    MASTER_CAPTCHA = String(Math.floor(100000 + Math.random() * 900000));
    const c = $("masterCaptchaCanvas");
    if (!c) return;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#141b2d";
    ctx.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = "rgba(197,168,128,0.25)";
        ctx.beginPath();
        ctx.moveTo(Math.random() * c.width, Math.random() * c.height);
        ctx.lineTo(Math.random() * c.width, Math.random() * c.height);
        ctx.stroke();
    }
    ctx.font = "bold 24px monospace";
    ctx.fillStyle = "#c5a880";
    for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.translate(18 + i * 24, 30);
        ctx.rotate((Math.random() - 0.5) * 0.35);
        ctx.fillText(MASTER_CAPTCHA[i], 0, 0);
        ctx.restore();
    }
    if ($("masterCaptchaInput")) $("masterCaptchaInput").value = "";
}

async function initMasterSecurity() {
    if (isTurnstileEnabled()) {
        $("masterFallbackCaptcha").style.display = "none";
        $("masterTurnstile").style.display = "flex";
        $("masterSubtitle").innerText = "Enter Master Key & complete security check";
        MASTER_TS_TOKEN = "";
        try {
            const ts = await loadTurnstileScript();
            if (MASTER_TS_WIDGET !== null) {
                ts.reset(MASTER_TS_WIDGET);
            } else {
                MASTER_TS_WIDGET = ts.render("#masterTurnstile", {
                    sitekey: CONFIG.SECURITY.TURNSTILE_SITE_KEY,
                    action: "master_login",
                    theme: "dark",
                    callback: (token) => { MASTER_TS_TOKEN = token; },
                    "expired-callback": () => { MASTER_TS_TOKEN = ""; },
                    "error-callback": () => { MASTER_TS_TOKEN = ""; }
                });
            }
        } catch (e) {
            $("masterMsg").innerText = "Security widget failed to load. Please refresh.";
        }
    } else {
        $("masterFallbackCaptcha").style.display = "block";
        $("masterTurnstile").style.display = "none";
        generateMasterCaptcha();
    }
}

function resetMasterSecurity() {
    if (isTurnstileEnabled() && window.turnstile && MASTER_TS_WIDGET !== null) {
        MASTER_TS_TOKEN = "";
        window.turnstile.reset(MASTER_TS_WIDGET);
    } else {
        generateMasterCaptcha();
    }
}

async function withBusy(btn, fn) {
    if (btn && btn.disabled) return;
    if (btn) btn.disabled = true;
    try { return await fn(); }
    finally { if (btn) btn.disabled = false; }
}

document.addEventListener("DOMContentLoaded", async () => {
    const resumed = await api("saasResume");
    if (resumed && resumed.success) await enterHQ();
    else { await initMasterSecurity(); $("masterSecretInput").focus(); }
});

window.addEventListener("dc:auth-expired", () => showMasterLogin("Your session expired. Please log in again."));

function showMasterLogin(msg) {
    $("masterLogin").style.display = "flex";
    $("masterSecretInput").value = "";
    $("masterMsg").innerText = msg || "";
    initMasterSecurity();
    $("masterSecretInput").focus();
}

async function unlockMaster() {
    const secret = $("masterSecretInput").value.trim();
    if (!secret) { $("masterMsg").innerText = "Enter your Master Key."; return; }

    if (isTurnstileEnabled()) {
        if (!MASTER_TS_TOKEN) {
            $("masterMsg").innerText = "Please complete the Cloudflare security check.";
            return;
        }
    } else {
        const cap = ($("masterCaptchaInput")?.value || "").trim();
        if (cap !== MASTER_CAPTCHA) {
            $("masterMsg").innerText = "Incorrect 6-digit security code. Try again.";
            generateMasterCaptcha();
            $("masterCaptchaInput").focus();
            return;
        }
    }

    await withBusy($("masterBtn"), async () => {
        const res = await api("saasLogin", { secret, turnstileToken: MASTER_TS_TOKEN });
        if (!res || !res.success) {
            $("masterMsg").innerText = (res && res.message) || "Invalid Master Secret Key";
            resetMasterSecurity();
            $("masterSecretInput").select();
            return;
        }
        $("masterMsg").innerText = "";
        await enterHQ();
    });
}

async function enterHQ() {
    PAGE_OFFSET = 0;
    const ok = await reloadTenants(true);
    if (!ok) return;
    $("masterLogin").style.display = "none";
    $("masterSecretInput").value = "";
}

async function logoutMaster() {
    await api("saasLogout");
    location.reload();
}

const onSearchInput = debounce(() => {
    PAGE_OFFSET = 0;
    reloadTenants();
}, 260);

function onFilterChange() {
    PAGE_OFFSET = 0;
    reloadTenants();
}

function selectCityPill(cityName) {
    $("cityFilter").value = cityName;
    PAGE_OFFSET = 0;
    reloadTenants();
}

function goPage(delta) {
    const next = PAGE_OFFSET + delta * PAGE_LIMIT;
    if (next < 0 || next >= TOTAL_MATCHING) return;
    PAGE_OFFSET = next;
    reloadTenants();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function reloadTenants(isInitial = false) {
    const city = $("cityFilter") ? $("cityFilter").value : "";
    const status = $("tenantFilter") ? $("tenantFilter").value : "all";
    const search = $("tenantSearch") ? $("tenantSearch").value.trim() : "";
    const sort = $("tenantSort") ? $("tenantSort").value : "newest";

    const res = await api("saasList", {
        city, status, search, sort,
        limit: PAGE_LIMIT,
        offset: PAGE_OFFSET
    });
    if (!res || !res.success) {
        if (isInitial && !(res && res.authExpired)) {
            showMasterLogin((res && res.message) || "Could not load restaurants.");
        } else if (!(res && res.authExpired)) {
            showToast((res && res.message) || "Could not refresh list", true);
        }
        return false;
    }

    TENANTS = res.data || [];
    CITIES = res.cities || [];
    STATS = res.stats || {};
    TOTAL_MATCHING = Number(res.total_matching || 0);
    if (city && !CITIES.some(c => c.city === city)) {
        if ($("cityFilter")) $("cityFilter").value = "";
        PAGE_OFFSET = 0;
        return reloadTenants(isInitial);
    }
    if (TENANTS.length === 0 && PAGE_OFFSET > 0 && TOTAL_MATCHING > 0) {
        PAGE_OFFSET = Math.max(0, Math.floor((TOTAL_MATCHING - 1) / PAGE_LIMIT) * PAGE_LIMIT);
        return reloadTenants(isInitial);
    }
    PROVIDER_WA = res.provider_whatsapp || "";
    PROVIDER_UPI = res.provider_upi || "";

    syncCityDropdown();
    renderSaasBoard();
    return true;
}

function syncCityDropdown() {
    const sel = $("cityFilter");
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = `<option value="">All Cities (${CITIES.length})</option>` + CITIES.map(c =>
        `<option value="${escapeHTML(c.city)}">${escapeHTML(c.city)} (${c.total})</option>`
    ).join("");
    if (CITIES.some(c => c.city === cur)) sel.value = cur;
}

function tenantState(t) {
    const days = daysUntil(t.subscription_valid_till, t.timezone);
    const paused = t.is_active === false;
    const expired = days !== null && days < 0;
    const expiring = !paused && !expired && days !== null && days <= 5;
    return { days, paused, expired, expiring, live: !paused && !expired };
}

function renderSaasBoard() {
    const selectedCity = $("cityFilter").value || "";
    const attention = Number(STATS.attention || 0);

    $("saasStats").innerHTML = `
        <div class="statCard"><h4>${selectedCity ? escapeHTML(selectedCity) + " Restaurants" : "Total Restaurants"}</h4><h2>${Number(STATS.total || 0)}</h2></div>
        <div class="statCard"><h4>Cities Active</h4><h2>${Number(STATS.cities_count || CITIES.length || 0)}</h2></div>
        <div class="statCard"><h4>Live Subscriptions</h4><h2>${Number(STATS.live || 0)}</h2></div>
        <div class="statCard"><h4>Monthly Recurring Revenue</h4><h2>${formatMoney(STATS.mrr || 0)}</h2></div>
        <div class="statCard"><h4>Need Renewal Attention</h4><h2 style="color:${attention ? '#fbbf24' : '#c5a880'};">${attention}</h2></div>
        <div class="statCard"><h4>Total QR Scans</h4><h2>${Number(STATS.total_scans || 0)}</h2></div>
    `;

    const cBar = $("cityBar");
    if (CITIES.length > 0) {
        cBar.style.display = "flex";
        cBar.innerHTML = `<span class="cityBarLabel">Cities:</span>`
            + `<button type="button" class="cityPill ${selectedCity === "" ? "active" : ""}" onclick="selectCityPill('')">All <span>(${CITIES.reduce((s, c) => s + Number(c.total || 0), 0)})</span></button>`
            + CITIES.slice(0, 15).map(c => `
                <button type="button" class="cityPill ${selectedCity === c.city ? "active" : ""}" onclick="selectCityPill('${escapeJS(c.city)}')">
                    ${escapeHTML(c.city)} <span>${c.live}/${c.total} • ${formatMoney(c.mrr)}</span>
                </button>`).join("");
    } else {
        cBar.style.display = "none";
    }

    const grid = $("tenantGrid");
    if (TENANTS.length === 0) {
        grid.innerHTML = `<div class="tenantCard" style="grid-column:1/-1;text-align:center;color:#94a3b8;">${Number(STATS.total || 0) ? "No restaurants match your filter." : "No restaurants yet. Click “Onboard New Restaurant”."}</div>`;
        $("pagerBar").style.display = "none";
        return;
    }

    grid.innerHTML = TENANTS.map(t => {
        const s = tenantState(t);
        const slugEnc = encodeURIComponent(t.slug);
        const menuLink = new URL(`index.html?r=${slugEnc}`, window.location.href).href;
        const dashLink = new URL(`dashboard.html?r=${slugEnc}`, window.location.href).href;
        const jid = escapeJS(t.slug);
        const pill = s.paused ? ["pillPaused", "PAUSED"] : s.expired ? ["pillExpired", "EXPIRED"] : s.expiring ? ["pillExpiring", "EXPIRING"] : ["pillActive", "ACTIVE"];
        const dayText = s.days === null ? "-" : s.days < 0 ? `${-s.days}d overdue` : s.days === 0 ? "today" : `${s.days}d left`;
        const locLabel = [t.area, t.city, t.state].filter(Boolean).join(", ");

        return `
            <div class="tenantCard ${s.paused ? 'paused' : ''} ${s.expiring ? 'expiring' : ''} ${s.expired ? 'expired' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                    <div>
                        <h3 style="font-size:19px;">${escapeHTML(t.restaurant_name)}</h3>
                        <code style="color:#c5a880;font-size:12px;">?r=${escapeHTML(t.slug)}</code>
                        ${locLabel ? `<div><span class="locBadge">📍 ${escapeHTML(locLabel)}</span></div>` : ""}
                    </div>
                    <span class="statusPill ${pill[0]}">${pill[1]}</span>
                </div>
                <div style="font-size:13px;color:#94a3b8;line-height:1.65;">
                    <div>👤 <b>Owner:</b> ${escapeHTML(t.owner_name || "-")} (${escapeHTML(t.owner_phone || "-")})</div>
                    <div>🔒 <b>Admin PIN:</b> <span style="color:#4ade80;">Encrypted (Bcrypt)</span> &nbsp;•&nbsp; 🕒 ${escapeHTML(t.timezone || "Asia/Kolkata")}</div>
                    <div>📊 <b>Usage:</b> ${Number(t.item_count) || 0} Dishes &nbsp;•&nbsp; ${Number(t.scan_count) || 0} QR Scans</div>
                    <div>💳 <b>Plan:</b> ${formatMoney(t.plan_price ?? 399)}/mo &nbsp;•&nbsp; Valid: <b style="color:${s.expired ? '#f87171' : s.expiring ? '#fbbf24' : '#fff'};">${escapeHTML(String(t.subscription_valid_till || "-").substring(0, 10))}</b> <span style="font-size:12px;">(${dayText})</span></div>
                </div>
                <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid #1f2940;">
                    <a class="secondaryBtn" href="${menuLink}" target="_blank" rel="noopener"><i class="fa-solid fa-eye" aria-hidden="true"></i> Menu</a>
                    <a class="secondaryBtn" href="${dashLink}" target="_blank" rel="noopener"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Dashboard</a>
                    <button class="secondaryBtn" onclick="editTenant('${jid}')"><i class="fa-solid fa-pen" aria-hidden="true"></i> Edit / Reset PIN</button>
                    <button class="secondaryBtn" style="border-color:#16a34a;color:#4ade80;" onclick="extendSub('${jid}', this)">+30 Days</button>
                    ${t.owner_phone ? `<button class="secondaryBtn" onclick="sendRenewalWA('${jid}')"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Remind</button>` : ""}
                    <button class="secondaryBtn" style="border-color:${s.paused ? '#16a34a' : '#d97706'};color:${s.paused ? '#4ade80' : '#fbbf24'};" onclick="toggleTenant('${jid}', this)">${s.paused ? "Activate" : "Pause"}</button>
                    ${t.slug !== "demo" ? `<button class="secondaryBtn" aria-label="Delete ${escapeHTML(t.restaurant_name)}" style="border-color:#7f1d1d;color:#f87171;" onclick="deleteTenant('${jid}', this)"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>` : ""}
                </div>
            </div>
        `;
    }).join("");

    const pager = $("pagerBar");
    const from = PAGE_OFFSET + 1;
    const to = Math.min(PAGE_OFFSET + TENANTS.length, TOTAL_MATCHING);
    pager.style.display = "flex";
    pager.innerHTML = `
        <span>Showing <b>${from}–${to}</b> of <b>${TOTAL_MATCHING}</b> matching restaurant(s)</span>
        <div style="display:flex;gap:8px;">
            <button class="secondaryBtn" ${PAGE_OFFSET <= 0 ? "disabled" : ""} onclick="goPage(-1)">← Previous</button>
            <button class="secondaryBtn" ${to >= TOTAL_MATCHING ? "disabled" : ""} onclick="goPage(1)">Next →</button>
        </div>
    `;
}

function suggestCitySlug() {
    if ($("tSlug").readOnly) return;
    const namePart = ($("tName").value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
    const cityPart = ($("tCity").value || "").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 14);
    if (!namePart) { showToast("Enter Restaurant Name first", true); return; }
    $("tSlug").value = (cityPart ? `${namePart}-${cityPart}` : namePart).slice(0, 40);
}

function openTenantModal(tenant = null) {
    $("modalTitle").innerText = tenant ? `Edit ${tenant.restaurant_name}` : "Onboard New Restaurant";
    $("tSlug").value = tenant ? tenant.slug : "";
    $("tSlug").readOnly = Boolean(tenant);
    $("suggestSlugBtn").style.display = tenant ? "none" : "inline-flex";
    $("tName").value = tenant ? tenant.restaurant_name : "";
    $("tCity").value = tenant ? (tenant.city || "") : (CONFIG.UI.DEFAULT_CITY || "Indore");
    $("tState").value = tenant ? (tenant.state || "") : (CONFIG.UI.DEFAULT_STATE || "Madhya Pradesh");
    $("tArea").value = tenant ? (tenant.area || "") : "";
    $("tTagline").value = tenant ? (tenant.tagline || "") : "Fresh Food & Great Vibes";
    $("pinLabel").innerText = tenant ? "Reset Admin PIN (leave blank to keep existing)" : "Initial Admin PIN (4-12 characters)";
    $("tPin").value = "";
    $("tOwner").value = tenant ? (tenant.owner_name || "") : "";
    $("tPhone").value = tenant ? (tenant.owner_phone || "") : "";
    $("tCustomerWA").value = tenant ? (tenant.whatsapp_number || "") : "";
    const tzVal = tenant ? (tenant.timezone || "Asia/Kolkata") : "Asia/Kolkata";
    if (![...$("tTz").options].some(o => o.value === tzVal)) {
        const opt = document.createElement("option");
        opt.value = tzVal;
        opt.textContent = tzVal;
        $("tTz").insertBefore(opt, $("tTz").firstChild);
    }
    $("tTz").value = tzVal;
    $("tPlan").value = tenant ? (tenant.plan_price ?? 399) : 399;
    $("tTheme").value = tenant ? (tenant.theme_color || "gold") : "gold";
    $("tAddress").value = tenant ? (tenant.address || "") : "";

    const d = new Date(todayInRestaurantTZ($("tTz").value) + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + 30);
    $("tValid").value = String(tenant?.subscription_valid_till || "").substring(0, 10) || d.toISOString().substring(0, 10);

    $("cloneWrap").style.display = tenant ? "none" : "block";
    $("tClone").checked = !tenant;
    openOverlay("tenantModal");
}

function editTenant(slug) {
    const t = TENANTS.find(x => x.slug === slug);
    if (t) openTenantModal(t);
}

async function saveTenant(btn) {
    const isNew = !$("tSlug").readOnly;
    const pinVal = $("tPin").value.trim();
    if (isNew && !pinVal) { alert("Please set an initial Admin PIN for the new restaurant."); return; }
    if (pinVal && (pinVal.length < 4 || pinVal.length > 12)) { alert("PIN must be 4-12 characters (the owner login box accepts at most 12)."); return; }
    if (pinVal.startsWith("dcs_")) { alert("PIN cannot start with dcs_"); return; }
    const slug = $("tSlug").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
    const name = $("tName").value.trim();
    const city = $("tCity").value.trim() || CONFIG.UI.DEFAULT_CITY || "Indore";
    if (!slug || !name) { alert("Enter both URL Slug and Restaurant Name."); return; }
    const plan = Number($("tPlan").value === "" ? 399 : $("tPlan").value);
    if (!Number.isFinite(plan) || plan < 0 || plan > 1000000) { alert("Subscription price must be between 0 and 1,000,000."); return; }

    const phoneVal = $("tPhone").value.trim();
    const custWaVal = $("tCustomerWA").value.trim();
    const payload = {
        slug,
        restaurant_name: name,
        city,
        state: $("tState").value.trim(),
        area: $("tArea").value.trim(),
        timezone: $("tTz").value,
        tagline: $("tTagline").value.trim(),
        admin_pin: pinVal,
        owner_name: $("tOwner").value.trim(),
        owner_phone: phoneVal,
        plan_price: plan,
        subscription_valid_till: $("tValid").value,
        theme_color: $("tTheme").value,
        address: $("tAddress").value.trim(),
        clone_demo: isNew && $("tClone").checked,
        is_active: isNew ? true : (TENANTS.find(t => t.slug === slug)?.is_active !== false)
    };
    // Only send whatsapp_number if explicitly provided (or on new creation),
    // preventing Super Admin edits from overwriting a restaurant's separate customer WhatsApp.
    if (custWaVal !== "") {
        payload.whatsapp_number = custWaVal;
    } else if (isNew && phoneVal) {
        payload.whatsapp_number = phoneVal;
    }

    await withBusy(btn, async () => {
        const res = await api("saasUpsert", { payload });
        if (res && res.success) {
            closeOverlay("tenantModal");
            showToast(res.created ? "Restaurant created" : "Restaurant updated");
            reloadTenants();
        } else if (!(res && res.authExpired)) alert((res && res.message) || "Failed to save restaurant");
    });
}

function openMasterSecurityModal() {
    $("mNewSecret").value = "";
    $("mNewSecret2").value = "";
    $("mCurrentSecret").value = "";
    $("mProviderWA").value = PROVIDER_WA;
    $("mProviderUpi").value = PROVIDER_UPI;
    openOverlay("securityModal");
}

async function saveMasterConfig(btn) {
    const newSecret = $("mNewSecret").value.trim();
    const whatsapp = $("mProviderWA").value.trim();
    const upi = $("mProviderUpi").value.trim();
    let currentSecret = "";
    if (newSecret) {
        if (newSecret.length < 8) { alert("Master key must be at least 8 characters."); return; }
        if (newSecret !== $("mNewSecret2").value.trim()) { alert("The two master keys don't match."); return; }
        currentSecret = $("mCurrentSecret").value.trim();
        if (!currentSecret) { alert("Type your current Master Key to confirm the change."); return; }
    }
    await withBusy(btn, async () => {
        const res = await api("saasUpdateMaster", { currentSecret, newSecret, providerWhatsapp: whatsapp, providerUpi: upi });
        if (res && res.success) {
            PROVIDER_WA = whatsapp ? waNumber(whatsapp) : "";
            PROVIDER_UPI = upi;
            closeOverlay("securityModal");
            showToast(newSecret ? "Master key changed - other sessions were signed out" : "Settings updated");
        } else if (!(res && res.authExpired)) alert((res && res.message) || "Failed to update settings");
    });
}

async function adminAction(action, slug, btn) {
    await withBusy(btn, async () => {
        const res = await api(action, { targetSlug: slug });
        if (!res || !res.success) { if (!(res && res.authExpired)) alert((res && res.message) || "Action failed"); }
        await reloadTenants();
    });
}

function extendSub(slug, btn) {
    if (confirm(`Extend subscription for "${slug}" by +30 days?\n(Counts from today, or from the current end date if that is later, and activates the menu.)`)) return adminAction("saasExtend", slug, btn);
}

function sendRenewalWA(slug) {
    const t = TENANTS.find(x => x.slug === slug);
    if (!t || !t.owner_phone) return;
    const clean = waNumber(t.owner_phone);
    if (!clean) return;
    const upiLine = PROVIDER_UPI ? ` You can pay to UPI ID: ${PROVIDER_UPI}.` : "";
    const valid = t.subscription_valid_till ? String(t.subscription_valid_till).substring(0, 10) : "soon";
    const msg = `Hi ${t.owner_name || "there"}, your Digiconvo QR Menu subscription for ${t.restaurant_name} is valid till ${valid}. The renewal is ${formatMoney(t.plan_price ?? 399)}/month.${upiLine} Thank you!`;
    window.open(`https://wa.me/${clean}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}

function toggleTenant(slug, btn) {
    const t = TENANTS.find(x => x.slug === slug);
    const pausing = !t || t.is_active !== false;
    const msg = pausing
        ? `Pause "${slug}"? Its QR menu goes offline immediately.`
        : `Activate "${slug}"? Its QR menu goes live again.`;
    if (confirm(msg)) return adminAction("saasToggle", slug, btn);
}

function deleteTenant(slug, btn) {
    const typed = prompt(`This permanently deletes "${slug}" and ALL its menu items.\nType the slug to confirm:`);
    if (typed === slug) return adminAction("saasDelete", slug, btn);
}
</script>
