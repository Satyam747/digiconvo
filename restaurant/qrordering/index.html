<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DigiConvo Smart QR Ordering</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97706'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='900'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="customer.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  .v8-shell{max-width:480px;margin:0 auto;padding:20px 16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .v8-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 32px rgba(15,23,42,.08);border:1px solid #e2e8f0;}
  .mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
  .mode-btn{padding:10px 6px;border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;font-weight:700;font-size:12.5px;cursor:pointer;color:#334155;}
  .mode-btn.active{border-color:var(--accent,#d97706);background:#fffbeb;color:#92400e;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px;}
  .field input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;}
  .cta-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent,#d97706);color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .hidden{display:none !important;}
</style>
</head>
<body style="background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
<div class="v8-shell">
  <div class="v8-card">
    <div style="text-align:center;margin-bottom:14px;">
      <h1 id="rName" style="font-size:24px;font-weight:900;margin:0;">Loading...</h1>
      <p id="rTagline" style="font-size:13px;color:#64748b;margin:4px 0 0;"></p>
      <div id="rBadges" style="margin-top:8px;font-size:11.5px;color:#475569;"></div>
    </div>

    <div id="modeTabs" class="mode-tabs">
      <button type="button" class="mode-btn active" data-mode="dine_in" onclick="selectMode('dine_in')">🍽 Dine-In</button>
      <button type="button" class="mode-btn" data-mode="takeaway" onclick="selectMode('takeaway')">🛍 Takeaway</button>
      <button type="button" class="mode-btn" data-mode="direct" onclick="selectMode('direct')">🛵 Direct Order</button>
    </div>

    <form id="checkinForm">
      <div id="tableWrap" class="field">
        <label>Table Number *</label>
        <input id="gTable" placeholder="e.g. 5">
      </div>
      <div class="field">
        <label>Your Name *</label>
        <input id="gName" required placeholder="e.g. Aarav">
      </div>
      <div class="field">
        <label>Mobile Number (for Digital Bill & Loyalty Points)</label>
        <input id="gPhone" type="tel" maxlength="10" placeholder="10-digit WhatsApp number (optional)">
      </div>
      <button id="startBtn" type="submit" class="cta-btn">Open Live Menu →</button>
    </form>
  </div>
</div>
<script src="index.js"></script>
</body></html>
