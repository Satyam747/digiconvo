<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DigiConvo v8.0 — Multi-City QR Ordering HQ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f59e0b' font-family='sans-serif' font-weight='900'%3ED%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  body{background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;margin:0;}
  .hidden{display:none !important;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;}
  .topbar{background:#0f172a;color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .wrap{max-width:1300px;margin:0 auto;padding:16px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px;}
  .kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;}
  .kpi .l{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;} .kpi .v{font-size:23px;font-weight:900;}
  input,select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;}
  .btn{border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:#d97706;color:#fff;}
  .btn-dark{background:#0f172a;} .btn-green{background:#059669;} .btn-soft{background:#e2e8f0;color:#0f172a;} .btn-sm{padding:5px 8px;font-size:11.5px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;} th,td{padding:9px 8px;border-bottom:1px solid #e2e8f0;text-align:left;} th{background:#f8fafc;font-size:11px;text-transform:uppercase;color:#64748b;}
  .pill{padding:5px 11px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:12px;font-weight:700;cursor:pointer;margin:2px;}
  .pill.active{background:#0f172a;color:#fff;border-color:#0f172a;}
</style>
</head>
<body>
<div id="hqLogin" class="login-wrap">
  <div class="card" style="width:100%;max-width:400px;padding:24px;">
    <h2 style="margin:0 0 6px;">DigiConvo HQ Command Center</h2>
    <p style="font-size:12.5px;color:#64748b;margin:0 0 14px;">Multi-City Outlets • SaaS Payments • Safe Housekeeping</p>
    <form id="hqLoginForm">
      <div style="margin-bottom:10px;"><input id="hqEmail" type="email" required placeholder="Founder email" style="width:100%;"></div>
      <div style="margin-bottom:12px;"><input id="hqPass" type="password" required placeholder="Password" style="width:100%;"></div>
      <button type="submit" class="btn btn-dark" style="width:100%;">Unlock HQ</button>
    </form>
  </div>
</div>

<div id="hqView" class="hidden">
  <div class="topbar">
    <strong style="font-size:18px;">DigiConvo QR Ordering v8.0 — Multi-City HQ</strong>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-soft btn-sm" onclick="runHousekeeping()">Trim Old Logs (0 Orders Deleted)</button>
      <button class="btn btn-sm" onclick="logoutHq()">Logout</button>
    </div>
  </div>
  <div class="wrap">
    <div id="hqKpis" class="kpis"></div>
    <div class="card"><div id="hqCities"></div></div>
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <input id="hqSearch" placeholder="Search outlet, slug, city, org_id..." style="flex:1;" onkeydown="if(event.key==='Enter')loadHq()">
        <select id="hqTriage" onchange="loadHq()"><option value="">All Outlets</option><option value="expiring_7d">Expiring in 7d</option><option value="churn_risk">Silent / Churn Risk</option></select>
        <button class="btn" onclick="loadHq()">Search</button>
      </div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Outlet & City</th><th>Chain / Plan</th><th>GST / FSSAI</th><th>Today Orders / CRM</th><th>Valid Till</th><th>Actions</th></tr></thead><tbody id="hqTbody"></tbody></table></div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body></html>
