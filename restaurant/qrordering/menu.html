<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Menu — DigiConvo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97706'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='900'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="customer.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  body{background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;padding-bottom:92px;}
  .top{background:#0f172a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .wrap{max-width:780px;margin:0 auto;padding:14px;}
  .pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;}
  .pill{padding:6px 12px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .pill.active{background:var(--accent,#d97706);color:#fff;border-color:var(--accent,#d97706);}
  .dish{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .dish.soldout{opacity:0.55;}
  .btn{border:none;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent,#d97706);color:#fff;}
  .btn-soft{background:#e2e8f0;color:#0f172a;}
  .cart-bar{position:fixed;bottom:12px;left:12px;right:12px;max-width:756px;margin:0 auto;background:#0f172a;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:30;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:18px;max-height:88vh;overflow:auto;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="top">
  <div>
    <strong id="mRestName" style="font-size:16px;">Menu</strong>
    <div id="mGuestInfo" style="font-size:11.5px;opacity:.82;"></div>
  </div>
  <div style="display:flex;gap:6px;">
    <button id="waiterCallBtn" class="btn btn-soft" style="padding:6px 10px;font-size:12px;" onclick="openWaiterModal()">🔔 Call Staff</button>
    <a id="myOrdersLink" href="#" class="btn" style="padding:6px 10px;font-size:12px;text-decoration:none;">My Orders</a>
  </div>
</div>

<div class="wrap">
  <input id="mSearch" placeholder="Search dishes..." style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-bottom:10px;" oninput="renderMenu()">
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
    <button class="pill active" id="fAll" onclick="setDiet('all')">All</button>
    <button class="pill" id="fVeg" onclick="setDiet('veg')">🟢 Pure Veg</button>
    <button class="pill" id="fSpec" onclick="setDiet('special')">⭐ Specials</button>
  </div>
  <div id="catPills" class="pills"></div>
  <div id="menuList"></div>
</div>

<div id="cartBar" class="cart-bar hidden">
  <div><strong id="cbCount">0 items</strong> • <span id="cbTotal">₹0</span></div>
  <button class="btn" onclick="goCheckout()">View Cart & Checkout →</button>
</div>

<!-- CUSTOMIZE ADD-ONS / MODIFIERS / PORTION MODAL -->
<div id="custModal" class="modal-bg hidden">
  <div class="modal">
    <h3 id="cmDishName" style="margin:0 0 10px;">Customize Dish</h3>
    <div id="cmPortionBox" style="margin-bottom:10px;"></div>
    <div id="cmAddonsBox" style="margin-bottom:10px;"></div>
    <div id="cmModBox" style="margin-bottom:12px;"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-soft" onclick="closeCust()">Cancel</button>
      <button class="btn" onclick="confirmCustAdd()">Add to Cart</button>
    </div>
  </div>
</div>

<!-- WAITER CALL MODAL -->
<div id="waiterModal" class="modal-bg hidden">
  <div class="modal" style="max-width:360px;">
    <h3 style="margin:0 0 10px;">Need Assistance at Your Table?</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
      <button class="btn" onclick="sendCall('waiter')">🙋 Call Waiter</button>
      <button class="btn" onclick="sendCall('water')">💧 Drinking Water</button>
      <button class="btn" onclick="sendCall('bill')">🧾 Ask for Bill</button>
      <button class="btn btn-soft" onclick="sendCall('clean')">✨ Clean Table</button>
    </div>
    <button class="btn btn-soft" style="width:100%;" onclick="document.getElementById('waiterModal').classList.add('hidden')">Close</button>
  </div>
</div>

<script src="menu.js"></script>
</body></html>
