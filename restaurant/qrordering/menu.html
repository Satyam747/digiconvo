<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2440'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23c5a880' font-family='sans-serif' font-weight='900'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="customer.css">
</head>
<body class="page-menu">
<div class="app">
  <div id="announcementBanner" class="announceBar" hidden>
    <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
    <span id="announcementText"></span>
  </div>

  <div class="hero">
    <div class="brandRow">
      <div class="brandLogo">
        <img id="restaurantLogo" alt="" hidden referrerpolicy="no-referrer">
        <i id="logoIcon" class="fa-solid fa-utensils" aria-hidden="true"></i>
      </div>
      <div class="brandInfo" style="flex:1;">
        <h1 id="restaurantName">&nbsp;</h1>
        <p id="customerName">&nbsp;</p>
      </div>
      <div class="menuTopBadges">
        <button class="tableBadge liveTrack" id="trackOrderBtn" type="button" hidden>Track</button>
        <button class="tableBadge" id="tableNo" type="button" title="Change table">Table</button>
      </div>
    </div>
    <div id="quickActions" class="quickActions" hidden></div>
    <div id="loyaltyStrip" class="loyaltyStrip" hidden></div>
  </div>

  <div id="notice" class="notice" hidden></div>

  <div class="stickyTop">
    <div class="stickySearchRow">
      <div class="searchWrap">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="searchBox" type="search" placeholder="Search dishes, categories..." autocomplete="off" maxlength="60">
      </div>
      <button class="stickyActionBtn" id="fabMenuBtn" type="button" aria-label="Jump to category" title="Categories">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Menu</span>
      </button>
      <button class="stickyActionBtn staffCall" id="callStaffBtn" type="button" aria-label="Call staff" title="Call waiter, water, or bill">
        <i class="fa-solid fa-bell" aria-hidden="true"></i><span>Staff</span>
      </button>
    </div>
    <div class="filterPills" id="smartFilters" role="group" aria-label="Menu filters">
      <button type="button" class="fPill active" data-filter="all">All</button>
      <button type="button" class="fPill" data-filter="veg">Pure Veg</button>
      <button type="button" class="fPill" data-filter="nonveg">Non-Veg</button>
      <button type="button" class="fPill" data-filter="offers">Live Offers</button>
      <button type="button" class="fPill" data-filter="bestseller">Specials</button>
    </div>
    <div class="categories" id="categories"></div>
  </div>

  <div class="spotlightWrap" id="spotlightWrap" hidden>
    <div class="secTitle"><i class="fa-solid fa-fire" aria-hidden="true"></i> Live Offers &amp; Happy Hour</div>
    <div class="offerCarousel" id="offerCarousel"></div>
  </div>

  <div class="products" id="products"><div class="loading">Loading menu...</div></div>
</div>

<button class="cartBar" id="cartBar" type="button" hidden>
  <span><span id="cartItems">0 items</span><br><span id="cartTotal"></span></span>
  <span>Review Order <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
</button>

<!-- Category Jump Bottom-Sheet Drawer -->
<div class="modalOverlay" id="catJumpModal" hidden>
  <div class="drawerBox">
    <div class="drawerHeader">
      <h3><i class="fa-solid fa-book-open" aria-hidden="true"></i> Jump to Category</h3>
      <button type="button" class="closeBtn" data-close="catJumpModal" aria-label="Close">&times;</button>
    </div>
    <div id="catJumpList"></div>
  </div>
</div>

<!-- Dish Lightbox Bottom-Sheet Drawer -->
<div class="modalOverlay" id="lightboxModal" hidden>
  <div class="drawerBox" id="lightboxContent"></div>
</div>

<!-- Wi-Fi / Info Drawer -->
<div class="modalOverlay" id="wifiModal" hidden>
  <div class="drawerBox">
    <div class="drawerHeader">
      <h3><i class="fa-solid fa-wifi" aria-hidden="true"></i> Restaurant Details</h3>
      <button type="button" class="closeBtn" data-close="wifiModal" aria-label="Close">&times;</button>
    </div>
    <div id="wifiCard" class="infoBlock" hidden>
      <div class="infoLbl">Wi-Fi Network</div>
      <div class="infoVal" id="wifiSsid">--</div>
      <div class="infoLbl mt8">Password</div>
      <div class="wifiPassRow"><code id="wifiPass">--</code><button id="copyWifiBtn" class="copyChipBtn" type="button">Copy</button></div>
    </div>
    <div id="infoMeta" class="infoMeta"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="menu.js"></script>
<script src="v8_guest.js"></script>
<div id="dialog" class="modal"></div>
</body>
</html>
