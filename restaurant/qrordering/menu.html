<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="customer.css">
</head>
<body class="page-menu">
<div class="wrapper">
  <div class="header">
    <div class="customer">
      <h2 id="customerName">&nbsp;</h2>
      <p id="restaurantName">&nbsp;</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;"><button class="tableBadge" id="trackOrderBtn" type="button" hidden style="background:#10b981;color:#05070f;border-color:#10b981;">Track Order</button><button class="tableBadge" id="tableNo" type="button" data-action="change" title="Change name or table">Table</button></div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div class="search"><input id="searchBox" type="search" placeholder="Search dishes..." autocomplete="off" maxlength="60"></div>
  <div class="categories" id="categories"></div>
  <div class="products" id="products"><div class="loading">Loading menu...</div></div>
</div>
<button class="cartBar" id="cartBar" type="button" hidden>
  <span><span id="cartItems">0 items</span><br><span id="cartTotal"></span></span>
  <span>View Cart <i class="fa-solid fa-arrow-right"></i></span>
</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="menu.js"></script>
</body>
</html>
