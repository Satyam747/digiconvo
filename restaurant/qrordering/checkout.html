<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout — DigiConvo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97706'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='900'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="customer.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  body{background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;}
  .wrap{max-width:560px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px;}
  input{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;font-size:13.5px;}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:800;cursor:pointer;background:var(--accent,#d97706);color:#fff;}
  .btn-soft{background:#e2e8f0;color:#0f172a;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <a id="backMenu" href="#" style="text-decoration:none;font-weight:700;color:#0f172a;">← Back to Menu</a>
    <strong id="ckTitle">Your Cart</strong>
  </div>

  <div class="card" id="cartItemsBox"></div>

  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input id="couponInput" placeholder="Promo coupon code (e.g. WELCOME10)" style="text-transform:uppercase;">
      <button class="btn btn-soft" onclick="applyCoupon()">Apply</button>
    </div>
    <div id="loyaltyBox" class="hidden" style="background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input id="useLoyaltyChk" type="checkbox" style="width:auto;" onchange="renderSummary()">
        <span id="loyaltyLabel">Redeem Loyalty Points</span>
      </label>
    </div>
    <input id="ckNotes" placeholder="Cooking instructions (less oil, extra tissue, etc.)" style="margin-bottom:10px;">
    <details style="font-size:12.5px;color:#475569;">
      <summary style="cursor:pointer;font-weight:700;">Need B2B GST Invoice? (Optional Buyer GSTIN)</summary>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
        <input id="ckGstin" placeholder="15-char Buyer GSTIN" style="text-transform:uppercase;">
        <input id="ckLegal" placeholder="Company Legal Name">
      </div>
    </details>
  </div>

  <div class="card" id="summaryBox"></div>
  <button id="placeBtn" class="btn" style="width:100%;padding:14px;font-size:15px;" onclick="submitOrder()">Place Order to Kitchen →</button>
</div>
<script src="checkout.js"></script>
</body></html>
