<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Live Order Display</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="customer.css">
<style>
  body.page-token{margin:0;padding:18px;background:var(--bg-main,#05070f);color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;}
  .tokHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-col,#24304d);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .tokGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .tokCol{background:var(--bg-card,#141b2d);border:1px solid var(--border-col,#24304d);border-radius:16px;padding:16px;min-height:68vh;}
  .tokCol h2{margin:0 0 14px;font-size:24px;display:flex;align-items:center;justify-content:space-between;}
  .tokList{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;}
  .tokCard{border-radius:12px;padding:14px;text-align:center;background:var(--bg-panel,#0b0f19);border:2px solid var(--border-col,#24304d);}
  .tokCard.ready{border-color:#10b981;background:rgba(16,185,129,.12);}
  .tokNum{font-size:28px;font-weight:900;letter-spacing:.5px;}
  .tokMeta{font-size:13px;color:#94a3b8;margin-top:4px;}
  @media(max-width:760px){.tokGrid{grid-template-columns:1fr}.tokCol{min-height:auto;}}
</style>
</head>
<body class="page-token">
<div class="tokHead">
  <div><h1 id="tokRestName" style="margin:0;font-size:26px;">Order Status Board</h1><div style="font-size:13px;color:#94a3b8;">Auto-updates live &bull; Please collect your order when Ready</div></div>
  <div id="tokClock" style="font-size:20px;font-weight:700;color:var(--primary,#c5a880);">--:--</div>
</div>
<div class="tokGrid">
  <div class="tokCol">
    <h2 style="color:#f59e0b;"><span><i class="fa-solid fa-fire-burner"></i> Now Preparing</span><span id="prepCnt">0</span></h2>
    <div id="prepList" class="tokList"></div>
  </div>
  <div class="tokCol">
    <h2 style="color:#10b981;"><span><i class="fa-solid fa-bell-concierge"></i> Ready for Pickup</span><span id="readyCnt">0</span></h2>
    <div id="readyList" class="tokList"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="token.js"></script>
</body>
</html>
