<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reception Desk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif;}
body{background:#050f0c;color:#fff;min-height:100vh;}

.topbar{background:#091c16;border-bottom:1px solid #164e3b;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.brandTitle{font-size:18px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;}
.navLinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.navBtn{background:#0d261e;color:#e2e8f0;border:1px solid #164e3b;padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.navBtn:hover{border-color:#10b981;}
.navBtn.primary{background:#10b981;color:#04130e;border-color:#10b981;}

.peonBanner{background:#f59e0b;color:#05070f;padding:10px 20px;font-weight:800;display:none;justify-content:space-between;align-items:center;font-size:13.5px;}
.container{max-width:1220px;margin:auto;padding:18px;}

.panel{background:#091c16;border:1px solid #164e3b;border-radius:16px;padding:16px;margin-bottom:16px;}
.walkinGrid{display:grid;grid-template-columns:1.2fr 1.6fr 0.6fr 0.6fr 1fr 0.9fr 1.1fr;gap:10px;align-items:end;margin-top:10px;}
@media(max-width:900px){.walkinGrid{grid-template-columns:1fr 1fr;}}

label{display:block;font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:4px;text-transform:uppercase;}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid #164e3b;background:#050f0c;color:#fff;font-size:13.5px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:#10b981;}

.btn{border:none;padding:9px 13px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btnGreen{background:#10b981;color:#04130e;font-weight:800;}
.btnDark{background:#0d261e;color:#fff;border:1px solid #164e3b;}
.btnAmber{background:#f59e0b;color:#05070f;}
.btnRed{background:#dc2626;color:#fff;}

.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.tab{padding:10px 16px;border-radius:11px;background:#091c16;border:1px solid #164e3b;color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.tab.active{background:#10b981;color:#04130e;border-color:#10b981;font-weight:800;}

.patientCard{background:#091c16;border:1px solid #164e3b;border-radius:14px;padding:14px;margin-bottom:10px;}
.patientRow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.moreBox{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #164e3b;}
.moreBox.open{display:block;}

#loginScreen{position:fixed;inset:0;background:#050f0c;display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:#091c16;border:1px solid #164e3b;border-radius:20px;padding:34px 28px;max-width:360px;width:100%;text-align:center;}
.pinBox{letter-spacing:8px;font-size:22px;text-align:center;margin:18px 0;padding:12px;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalContent{background:#091c16;border:1px solid #164e3b;border-radius:18px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;}
</style>
</head>
<body>

<!-- 6-DIGIT PIN LOGIN -->
<div id="loginScreen">
    <div class="loginCard">
        <i class="fa-solid fa-desktop" style="font-size:34px;color:#10b981;margin-bottom:10px;"></i>
        <h2 id="loginClinicName">Reception Desk</h2>
        <p style="font-size:13px;color:#94a3b8;margin-top:4px;">Enter 6-Digit Reception PIN</p>
        <input type="password" id="recPinInput" class="pinBox" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')" onkeyup="if(event.key==='Enter')unlockReception()">
        <button class="btn btnGreen" style="width:100%;justify-content:center;padding:13px;font-size:14px;" onclick="unlockReception()">Unlock Desk</button>
    </div>
</div>

<!-- TOP BAR (LINKS ONLY TO DOCTOR CABIN & TV) -->
<div class="topbar">
    <div class="brandTitle">
        <span id="hdrClinicName">Reception Desk</span>
    </div>
    <div class="navLinks">
        <select id="docDropdown" onchange="switchActiveDoctor(this.value)" style="width:auto;min-width:210px;font-weight:700;border-color:#10b981;"></select>
        <select id="opdStatusSelect" onchange="changeOpdStatus(this.value)" style="width:auto;font-weight:700;">
            <option value="running">🟢 OPD Open</option>
            <option value="delayed">🟡 Delayed (+30m)</option>
            <option value="closed">🔴 OPD Closed</option>
        </select>
        <a id="linkDoctorPage" href="doctor.html" class="navBtn"><i class="fa-solid fa-user-doctor"></i> Doctor Cabin</a>
        <a id="linkTvPage" href="index.html?view=tv" target="_blank" class="navBtn"><i class="fa-solid fa-tv"></i> TV Screen</a>
        <button class="navBtn" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Settings</button>
    </div>
</div>

<div class="peonBanner" id="peonBanner">
    <span>🔔 Doctor is calling staff inside the cabin</span>
    <button class="btn btnDark" onclick="staffMutate('togglePeonBell',{active:false})">Dismiss</button>
</div>

<div class="container">
    <!-- NEW WALK-IN BAR -->
    <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
            <span style="font-size:13px;font-weight:800;color:#10b981;">New Walk-In Token</span>
            <span id="returningHint" style="font-size:12px;color:#fbbf24;font-weight:700;display:none;"></span>
        </div>
        <div class="walkinGrid">
            <div><label>Mobile Number</label><input id="wPhone" maxlength="10" placeholder="10-digit mobile" oninput="lookupReturningPatient(this.value)"></div>
            <div><label>Patient Name</label><input id="wName" placeholder="Full Name"></div>
            <div><label>Age</label><input id="wAge" type="number" placeholder="Age"></div>
            <div><label>Gender</label><select id="wGender"><option value="M">M</option><option value="F">F</option><option value="O">O</option></select></div>
            <div><label>Visit Type</label><select id="wVisit" onchange="onWalkinVisitChange()"><option value="Fresh">New Visit</option><option value="Follow-up">Follow-Up (Free)</option><option value="Report">Report Check</option></select></div>
            <div><label>Payment</label><select id="wPay"><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Free">Free</option></select></div>
            <div><button class="btn btnGreen" style="width:100%;justify-content:center;padding:10px;" onclick="issueWalkIn()">+ Issue Token</button></div>
        </div>
    </div>

    <!-- WORKFLOW TABS -->
    <div class="tabs">
        <button class="tab active" id="tabBtn-waiting" onclick="setTab('waiting')">Waiting Queue (<span id="cntWait">0</span>)</button>
        <button class="tab" id="tabBtn-inquiries" onclick="setTab('inquiries')">Online Requests (<span id="cntInq">0</span>)</button>
        <button class="tab" id="tabBtn-lab" onclick="setTab('lab')">In Lab / X-Ray (<span id="cntLab">0</span>)</button>
        <button class="tab" id="tabBtn-completed" onclick="setTab('completed')">Today's Collection (<span id="cntComp">0</span>)</button>
        <button class="tab" id="tabBtn-recall" onclick="setTab('recall')">Follow-Ups Due (<span id="cntRec">0</span>)</button>
    </div>

    <div id="tabBody"></div>
</div>

<!-- SETTINGS & DOCTORS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modalContent">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="color:#10b981;font-size:18px;">Clinic Settings & Doctors</h3>
            <button class="btn btnDark" onclick="document.getElementById('settingsModal').classList.remove('show')">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="grid-column:1/3;">
                <label>Clinic Name</label>
                <input id="sClinicName">
            </div>
            <div style="grid-column:1/3;">
                <label>Doctors List (One Doctor per line — shows in Dropdown)</label>
                <textarea id="sDoctorsList" rows="4" placeholder="Dr. Rajesh Patidar (MS Ortho)&#10;Dr. Neha Patidar (MDS Dental)&#10;Dr. Alok Sharma (MD Medicine)"></textarea>
            </div>
            <div>
                <label>New Visit Fee (₹)</label>
                <input id="sFeeFresh" type="number">
            </div>
            <div>
                <label>Report Check Fee (₹)</label>
                <input id="sFeeReport" type="number">
            </div>
            <div>
                <label>Clinic UPI ID</label>
                <input id="sUpi">
            </div>
            <div>
                <label>Clinic WhatsApp Number</label>
                <input id="sWa" placeholder="9198XXXXXXXX">
            </div>
            <div style="grid-column:1/3;">
                <label>Change 6-Digit Reception PIN (Leave blank to keep current)</label>
                <input type="password" id="sNewPin" maxlength="6" placeholder="Enter new 6-digit PIN" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
            <button class="btn btnDark" onclick="document.getElementById('settingsModal').classList.remove('show')">Cancel</button>
            <button class="btn btnGreen" onclick="saveSettings()">Save Changes</button>
        </div>
    </div>
</div>

<script>
let STATE = null;
let ACTIVE_TAB = "waiting";
let OPEN_DRAWERS = {};

document.addEventListener("DOMContentLoaded", () => {
    const slug = encodeURIComponent(CONFIG.TENANT.SLUG);
    document.getElementById("linkDoctorPage").href = `doctor.html?c=${slug}`;
    document.getElementById("linkTvPage").href = `index.html?c=${slug}&view=tv`;

    const savedPin = sessionStorage.getItem(CONFIG.STORAGE.RECEPTION_PIN);
    if (savedPin) {
        document.getElementById("recPinInput").value = savedPin;
        unlockReception();
    }
    window.addEventListener("storage", () => {
        if (sessionStorage.getItem(CONFIG.STORAGE.RECEPTION_PIN)) loadDashboard();
    });
});

async function unlockReception() {
    const pin = document.getElementById("recPinInput").value.trim();
    const res = await api("verifyReceptionPin", { pin });
    if (!res || !res.success) {
        sessionStorage.removeItem(CONFIG.STORAGE.RECEPTION_PIN);
        alert(res?.message || "Invalid 6-digit PIN");
        return;
    }
    sessionStorage.setItem(CONFIG.STORAGE.RECEPTION_PIN, pin);
    document.getElementById("loginScreen").style.display = "none";
    initInactivityAutoLock(CONFIG.STORAGE.RECEPTION_PIN);
    loadDashboard();
}

async function loadDashboard() {
    const res = await api("getStaffDashboard", { role: "reception" });
    if (!res || !res.success) return;
    STATE = res.clinic;
    renderReception();
}

async function staffMutate(op, payload) {
    const res = await api("staffAction", { role: "reception", op, payload });
    if (res && res.success) {
        STATE = res.clinic;
        renderReception();
    } else {
        alert(res?.message || "Action failed");
    }
}

function renderReception() {
    const c = STATE;
    const docs = normalizeDoctorsList(c);
    const activeDoc = c.active_doctor || docs[0].id;

    document.title = `${c.clinic_name} — Reception Desk`;
    document.getElementById("hdrClinicName").innerText = c.clinic_name;
    document.getElementById("peonBanner").style.display = c.peon_bell ? "flex" : "none";
    document.getElementById("opdStatusSelect").value = c.opd_status || "running";

    // Populate Multi-Doctor Dropdown
    const docSel = document.getElementById("docDropdown");
    docSel.innerHTML = docs.map(d =>
        `<option value="${escapeHTML(d.id)}" ${d.id === activeDoc ? "selected" : ""}>👨‍⚕️ ${escapeHTML(d.name)}</option>`
    ).join("");

    const docTokens = (c.tokens || []).filter(t => (t.doctor || docs[0].id) === activeDoc);
    const inside = docTokens.find(t => t.status === "inside");
    const inq = docTokens.filter(t => t.status === "inquiry");
    const wait = docTokens.filter(t => t.status === "waiting").sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0) || (a.token || 999) - (b.token || 999));
    const lab = docTokens.filter(t => t.status === "lab");
    const comp = docTokens.filter(t => t.status === "completed");
    const rec = c.recalls || [];

    document.getElementById("cntWait").innerText = wait.length;
    document.getElementById("cntInq").innerText = inq.length;
    document.getElementById("cntLab").innerText = lab.length;
    document.getElementById("cntComp").innerText = comp.length;
    document.getElementById("cntRec").innerText = rec.length;

    const box = document.getElementById("tabBody");

    const insideBanner = inside ? `
        <div class="panel" style="background:#064e3b;border-color:#10b981;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div><b style="color:#a7f3d0;">NOW INSIDE CABIN:</b> &nbsp;<strong style="font-size:16px;">Token #${inside.token} — ${escapeHTML(inside.name)} (${inside.age}${inside.gender})</strong></div>
            <button class="btn btnDark" onclick="announceTokenVoiceHindi(${inside.token}, '${escapeJS(inside.name)}')">🔊 Announce Again</button>
        </div>
    ` : "";

    if (ACTIVE_TAB === "waiting") {
        box.innerHTML = insideBanner + (wait.length === 0 ? `<div class="patientCard" style="color:#94a3b8;">No patients waiting for this doctor.</div>` : wait.map(w => `
            <div class="patientCard">
                <div class="patientRow">
                    <div>
                        <strong style="color:#10b981;font-size:16px;">#${w.token}</strong> &nbsp;<b>${escapeHTML(w.name)} (${w.age}${escapeHTML(w.gender)})</b>
                        <span style="color:#94a3b8;font-size:13px;"> • ${escapeHTML(w.visit_type)} ₹${w.fee} (${escapeHTML(w.pay_mode)})</span>
                        ${w.vip ? `<span style="background:#7c2d12;color:#fdba74;padding:2px 7px;border-radius:6px;font-size:11px;margin-left:6px;">Priority</span>` : ""}
                    </div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn ${w.arrived ? 'btnGreen' : 'btnAmber'}" onclick="staffMutate('toggleArrived',{id:'${escapeJS(w.id)}'})">${w.arrived ? '✓ Present' : 'Mark Present'}</button>
                        <button class="btn btnGreen" onclick="sendInsideCabin('${escapeJS(w.id)}', ${w.token}, '${escapeJS(w.name)}')">Send to Cabin</button>
                        <button class="btn btnDark" onclick="sendTurnAlertWA('${escapeJS(w.phone)}','${escapeJS(w.name)}',${w.token})"><i class="fa-brands fa-whatsapp"></i> Alert</button>
                        <button class="btn btnDark" onclick="toggleMore('${escapeJS(w.id)}')">Options ▾</button>
                    </div>
                </div>
                <div class="moreBox ${OPEN_DRAWERS[w.id] ? 'open' : ''}">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px;">
                        <div><label>BP</label><input id="vBp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.bp || '')}" placeholder="120/80"></div>
                        <div><label>Weight (kg)</label><input id="vWt-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.wt || '')}" placeholder="70"></div>
                        <div><label>Temp (°F)</label><input id="vTp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.temp || '')}" placeholder="98.6"></div>
                        <div><label>SpO2 (%)</label><input id="vSp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.spo2 || '')}" placeholder="99"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                            <button class="btn btnGreen" onclick="saveVitals('${escapeJS(w.id)}')">Save Vitals</button>
                            <button class="btn btnDark" onclick="staffMutate('parkInLab',{id:'${escapeJS(w.id)}'})">Send to Lab / X-Ray</button>
                            <button class="btn btnDark" onclick="staffMutate('toggleVip',{id:'${escapeJS(w.id)}'})">Move to Top</button>
                            <button class="btn btnDark" onclick="printThermalTokenSlip(STATE.tokens.find(x=>x.id==='${escapeJS(w.id)}'), STATE)">Print Slip</button>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'Cash'})">Cash</button>
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'UPI'})">UPI</button>
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'Free'})">Free</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join(""));
    } else if (ACTIVE_TAB === "inquiries") {
        box.innerHTML = inq.length === 0 ? `<div class="patientCard" style="color:#94a3b8;">No pending online requests.</div>` : inq.map(i => `
            <div class="patientCard" style="border-color:#f59e0b;">
                <div class="patientRow">
                    <div>
                        <b>${escapeHTML(i.name)} (${i.age}${escapeHTML(i.gender)})</b> • ${escapeHTML(i.visit_type)} ₹${i.fee}
                        <div style="font-size:12.5px;color:#94a3b8;margin-top:3px;">Mobile: ${escapeHTML(i.phone)} • Payment: <b>${escapeHTML(i.pay_mode)}</b> ${i.utr ? `• UPI Last 4: <b style="color:#4ade80;">${escapeHTML(i.utr)}</b>` : ""}</div>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btnGreen" onclick="approveRequest('${escapeJS(i.id)}')">Approve & Issue Token</button>
                        <button class="btn btnRed" onclick="staffMutate('rejectInquiry',{id:'${escapeJS(i.id)}'})">Decline</button>
                    </div>
                </div>
            </div>
        `).join("");
    } else if (ACTIVE_TAB === "lab") {
        box.innerHTML = lab.length === 0 ? `<div class="patientCard" style="color:#94a3b8;">No patients in Lab / X-Ray.</div>` : lab.map(l => `
            <div class="patientCard">
                <div class="patientRow">
                    <div><b>#${l.token} — ${escapeHTML(l.name)} (${l.age}${escapeHTML(l.gender)})</b></div>
                    <button class="btn btnGreen" onclick="staffMutate('returnFromLab',{id:'${escapeJS(l.id)}'})">Report Ready — Move to Queue</button>
                </div>
            </div>
        `).join("");
    } else if (ACTIVE_TAB === "completed") {
        const cash = comp.filter(x => x.pay_mode === "Cash").reduce((s, x) => s + Number(x.fee || 0), 0);
        const upi = comp.filter(x => x.pay_mode === "UPI").reduce((s, x) => s + Number(x.fee || 0), 0);
        const free = comp.filter(x => x.pay_mode === "Free" || Number(x.fee) === 0).length;
        const total = cash + upi;

        box.innerHTML = `
            <div class="panel" style="background:#064e3b;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                <div style="font-size:14px;font-weight:700;">
                    Patients Seen: <b>${comp.length}</b> &nbsp;|&nbsp; Cash: <b>₹${cash}</b> &nbsp;|&nbsp; UPI: <b>₹${upi}</b> &nbsp;|&nbsp; Free: <b>${free}</b> &nbsp;|&nbsp; Total: <b style="color:#fde68a;">₹${total}</b>
                </div>
                <button class="btn btnGreen" onclick="sendDailySummaryWA(${comp.length},${cash},${upi},${free},${total})"><i class="fa-brands fa-whatsapp"></i> Send Summary to Doctor</button>
            </div>
        ` + comp.map(x => `
            <div class="patientCard">
                <div class="patientRow">
                    <div><b>#${x.token} — ${escapeHTML(x.name)}</b> • ₹${x.fee} (${escapeHTML(x.pay_mode)})</div>
                    <button class="btn btnDark" onclick="sendReceiptWA('${escapeJS(x.phone)}','${escapeJS(x.name)}',${x.fee})"><i class="fa-brands fa-whatsapp"></i> Send Receipt</button>
                </div>
            </div>
        `).join("");
    } else if (ACTIVE_TAB === "recall") {
        box.innerHTML = rec.length === 0 ? `<div class="patientCard" style="color:#94a3b8;">No follow-ups due today.</div>` : rec.map(r => `
            <div class="patientCard">
                <div class="patientRow">
                    <div>
                        <b>${escapeHTML(r.name)} (${r.age}${escapeHTML(r.gender)})</b> • ${escapeHTML(r.phone)}
                        <div style="font-size:12.5px;color:#94a3b8;">${escapeHTML(r.reason)}</div>
                    </div>
                    <button class="btn btnGreen" onclick="openWhatsApp('${escapeJS(r.phone)}','Namaste ${escapeJS(r.name)} ji, your follow-up visit at ${escapeJS(c.clinic_name)} is due today.')"><i class="fa-brands fa-whatsapp"></i> Send Reminder</button>
                </div>
            </div>
        `).join("");
    }
}

function setTab(t) {
    ACTIVE_TAB = t;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.getElementById("tabBtn-" + t).classList.add("active");
    renderReception();
}

function switchActiveDoctor(docId) {
    staffMutate("switchDoctor", { doctor: docId });
}

function changeOpdStatus(st) {
    staffMutate("setOpdStatus", { status: st });
}

function toggleMore(id) {
    OPEN_DRAWERS[id] = !OPEN_DRAWERS[id];
    renderReception();
}

function saveVitals(id) {
    staffMutate("saveVitals", {
        id,
        bp: document.getElementById("vBp-" + id).value.trim(),
        wt: document.getElementById("vWt-" + id).value.trim(),
        temp: document.getElementById("vTp-" + id).value.trim(),
        spo2: document.getElementById("vSp-" + id).value.trim()
    });
}

function lookupReturningPatient(val) {
    const clean = val.replace(/\D/g, "");
    document.getElementById("wPhone").value = clean;
    const hint = document.getElementById("returningHint");
    if (clean.length === 10 && STATE?.history_lookup?.[clean]) {
        const h = STATE.history_lookup[clean];
        document.getElementById("wName").value = h.name;
        document.getElementById("wAge").value = h.age;
        document.getElementById("wGender").value = h.gender;
        hint.style.display = "inline";
        hint.innerText = `Visited ${h.daysAgo} days ago`;
        if (h.daysAgo <= 5) {
            document.getElementById("wVisit").value = "Follow-up";
            document.getElementById("wPay").value = "Free";
        }
    } else {
        hint.style.display = "none";
    }
}

function onWalkinVisitChange() {
    if (document.getElementById("wVisit").value === "Follow-up") {
        document.getElementById("wPay").value = "Free";
    }
}

function issueWalkIn() {
    const phone = document.getElementById("wPhone").value.trim();
    const name = document.getElementById("wName").value.trim();
    const age = document.getElementById("wAge").value.trim();
    if (!phone || !name || !age) { alert("Please enter Mobile, Name, and Age."); return; }
    staffMutate("walkIn", {
        phone, name, age,
        doctor: document.getElementById("docDropdown").value,
        gender: document.getElementById("wGender").value,
        visit_type: document.getElementById("wVisit").value,
        pay_mode: document.getElementById("wPay").value
    });
    document.getElementById("wPhone").value = "";
    document.getElementById("wName").value = "";
    document.getElementById("wAge").value = "";
    document.getElementById("returningHint").style.display = "none";
}

async function approveRequest(id) {
    await staffMutate("approveInquiry", { id });
    const updated = STATE.tokens.find(x => x.id === id);
    if (updated) {
        openWhatsApp(updated.phone, `Your appointment token at ${STATE.clinic_name} is confirmed: Token #${updated.token}.`);
    }
}

function sendInsideCabin(id, token, name) {
    staffMutate("sendInside", { id, doctor: document.getElementById("docDropdown").value });
    announceTokenVoiceHindi(token, name);
}

function sendTurnAlertWA(phone, name, token) {
    openWhatsApp(phone, `Namaste ${name} ji, your Token #${token} at ${STATE.clinic_name} will be called shortly. Please be ready.`);
}

function sendDailySummaryWA(count, cash, upi, free, total) {
    const docName = getDoctorNameById(STATE, STATE.active_doctor);
    const msg = `*Daily OPD Summary — ${STATE.clinic_name}*\nDoctor: ${docName}\n• Total Patients: ${count}\n• Cash: ₹${cash}\n• UPI: ₹${upi}\n• Free Follow-ups: ${free}\n• *Total Collection: ₹${total}*`;
    openWhatsApp(STATE.whatsapp_number, msg);
}

function sendReceiptWA(phone, name, fee) {
    openWhatsApp(phone, `Thank you ${name} ji for visiting ${STATE.clinic_name}. Paid: ₹${fee}.`);
}

function openSettingsModal() {
    const docs = normalizeDoctorsList(STATE);
    document.getElementById("sClinicName").value = STATE.clinic_name || "";
    document.getElementById("sDoctorsList").value = formatDoctorsToText(docs);
    document.getElementById("sFeeFresh").value = STATE.fee_fresh || 500;
    document.getElementById("sFeeReport").value = STATE.fee_report || 200;
    document.getElementById("sUpi").value = STATE.upi_id || "";
    document.getElementById("sWa").value = STATE.whatsapp_number || "";
    document.getElementById("sNewPin").value = "";
    document.getElementById("settingsModal").classList.add("show");
}

async function saveSettings() {
    const newPin = document.getElementById("sNewPin").value.trim();
    if (newPin && !/^[0-9]{6}$/.test(newPin)) { alert("New PIN must be 6 digits."); return; }
    const doctors = parseDoctorsFromText(document.getElementById("sDoctorsList").value);
    await staffMutate("saveSettings", {
        clinic_name: document.getElementById("sClinicName").value.trim(),
        doctors: doctors,
        doc1_name: doctors[0]?.name || "Doctor 1",
        doc2_name: doctors[1]?.name || "",
        fee_fresh: Number(document.getElementById("sFeeFresh").value || 500),
        fee_report: Number(document.getElementById("sFeeReport").value || 200),
        upi_id: document.getElementById("sUpi").value.trim(),
        whatsapp_number: document.getElementById("sWa").value.trim(),
        new_pin: newPin
    });
    document.getElementById("settingsModal").classList.remove("show");
}
</script>
