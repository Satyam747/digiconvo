<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://wmuihwywxetbzrrjzspm.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClinicOS Super Admin HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261113-6"></script>
<script src="common.js?v=20261113-6"></script>
<style>
:root{
    --primary:#059669;
    --primary-light:#ecfdf5;
    --bg-page:#f1f5f9;
    --bg-surface:#ffffff;
    --bg-muted:#f8fafc;
    --text-main:#0f172a;
    --text-secondary:#475569;
    --text-muted:#64748b;
    --border-col:#e2e8f0;
    --shadow-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
    --shadow-md:0 10px 25px -5px rgba(15,23,42,0.08),0 8px 10px -6px rgba(15,23,42,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;}
body{background:var(--bg-page);color:var(--text-main);min-height:100vh;padding:28px 20px;}
.container{max-width:1260px;margin:0 auto;}

.header{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:20px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.header h1{font-size:22px;font-weight:800;color:var(--text-main);display:flex;align-items:center;gap:10px;}

.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:26px;}
.statCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:18px;padding:20px;box-shadow:var(--shadow-sm);}
.statCard h4{color:var(--text-muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.statCard h2{font-size:30px;font-weight:800;color:var(--primary);font-family:'JetBrains Mono',monospace;}

.primaryBtn{background:var(--primary);color:#ffffff;border:none;padding:11px 18px;border-radius:11px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 12px rgba(5,150,105,0.22);transition:0.18s;}
.primaryBtn:hover{background:#047857;}
.secondaryBtn{background:var(--bg-muted);color:var(--text-main);border:1.5px solid var(--border-col);padding:8px 13px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:0.15s;}
.secondaryBtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}

.tenantGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:18px;}
.tenantCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);}
.tenantCard.paused{border-color:#fca5a5;background:#fffafa;}
.statusPill{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;}
.pillActive{background:#d1fae5;color:#065f46;}
.pillPaused{background:#fee2e2;color:#991b1b;}

.modal{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalBox{width:660px;max-width:100%;background:var(--bg-surface);border:1px solid var(--border-col);border-radius:22px;padding:26px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.formGrid label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;}
.formGrid input,.formGrid select,.formGrid textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border-col);background:var(--bg-muted);color:var(--text-main);font-size:13.5px;font-weight:600;outline:none;}
.formGrid input:focus,.formGrid textarea:focus{border-color:var(--primary);background:var(--bg-surface);}
.full{grid-column:1/3;}

#masterLogin{position:fixed;inset:0;background:var(--bg-page);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:24px;padding:38px 32px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-md);}
.loginCard input{width:100%;padding:13px;border-radius:11px;border:1.5px solid var(--border-col);background:var(--bg-muted);color:var(--text-main);margin:18px 0;text-align:center;font-size:16px;outline:none;}
</style>
</head>
<body>

<div id="masterLogin">
    <div class="loginCard">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;">
            <i class="fa-solid fa-crown"></i>
        </div>
        <h2 style="font-size:22px;font-weight:800;">ClinicOS Super Admin</h2>
        <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">Enter your 16+ character Master Key</p>
        <input type="password" id="masterSecretInput" placeholder="••••••••••••••••" autocomplete="off" onkeyup="if(event.key==='Enter')unlockMaster()">
        <button class="primaryBtn" style="width:100%;justify-content:center;padding:14px;" onclick="unlockMaster()">
            <i class="fa-solid fa-unlock-keyhole"></i> Unlock Super Admin HQ
        </button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <h1>
                <span style="width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:18px;"><i class="fa-solid fa-crown"></i></span>
                ClinicOS SaaS Super Admin
            </h1>
            <p style="color:var(--text-secondary);font-size:13px;margin-top:4px;">Multi-Tenant Clinic Onboarding, Per-Doctor PINs & Subscription Control</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="secondaryBtn" onclick="openMasterSecurityModal()"><i class="fa-solid fa-key"></i> Master Key & Billing</button>
            <button class="primaryBtn" onclick="openTenantModal()"><i class="fa-solid fa-plus"></i> Onboard New Clinic</button>
        </div>
    </div>

    <div class="statsGrid" id="saasStats"></div>
    <div class="tenantGrid" id="tenantGrid"></div>
</div>

<!-- ONBOARD / EDIT CLINIC MODAL -->
<div class="modal" id="tenantModal">
    <div class="modalBox">
        <h3 id="modalTitle" style="color:var(--text-main);font-size:20px;font-weight:800;">Onboard New Clinic</h3>
        <div class="formGrid">
            <div>
                <label for="tSlug">URL Slug (e.g. patidar)</label>
                <input id="tSlug" placeholder="patidar">
            </div>
            <div>
                <label for="tName">Clinic Name</label>
                <input id="tName" placeholder="Patidar Ortho & Multispecialty Clinic">
            </div>
            <div class="full">
                <label for="tDoctors">Doctors in Clinic (One per line: Doctor Name | Reg. No. | Optional 6-Digit PIN)</label>
                <textarea id="tDoctors" rows="4" placeholder="Dr. Rajesh Patidar (MS Ortho) | MPMC-14892 | 654321&#10;Dr. Neha Patidar (MDS Dental) | MPDC-8821 | 654322"></textarea>
            </div>
            <div>
                <label id="recPinLabel" for="tRecPin">6-Digit Reception PIN</label>
                <input type="password" id="tRecPin" maxlength="6" placeholder="6 digits (e.g. 123456)" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
            <div>
                <label id="docPinLabel" for="tDocPin">Default 6-Digit Doctor PIN</label>
                <input type="password" id="tDocPin" maxlength="6" placeholder="Used if not set per line above" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
            <div>
                <label for="tPhone">Owner WhatsApp (with 91)</label>
                <input id="tPhone" placeholder="9198XXXXXXXX">
            </div>
            <div>
                <label for="tUpi">Clinic UPI ID</label>
                <input id="tUpi" placeholder="clinic@ybl">
            </div>
            <div>
                <label for="tFee">New Visit Fee (₹)</label>
                <input type="number" id="tFee" value="500" min="0">
            </div>
            <div>
                <label for="tPlan">Monthly Subscription (₹)</label>
                <input type="number" id="tPlan" value="499" min="0">
            </div>
            <div>
                <label for="tValid">Subscription Valid Till</label>
                <input type="date" id="tValid">
            </div>
            <div>
                <label for="tTagline">Address / City Area</label>
                <input id="tTagline" placeholder="Sapna Sangeeta, Indore">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--border-col);">
            <button class="secondaryBtn" onclick="document.getElementById('tenantModal').classList.remove('show')">Cancel</button>
            <button class="primaryBtn" onclick="saveTenant()">Save Clinic</button>
        </div>
    </div>
</div>

<!-- MASTER PASSWORD & BILLING MODAL -->
<div class="modal" id="securityModal">
    <div class="modalBox">
        <h3 style="color:var(--text-main);font-size:20px;font-weight:800;">Master Key & Renewal Settings</h3>
        <div class="formGrid">
            <div class="full">
                <label for="mNewSecret">New Master Key (Min 16 characters — leave blank to keep current)</label>
                <input type="password" id="mNewSecret" placeholder="Enter new 16+ character Master Key">
            </div>
            <div class="full">
                <label for="mNewSecret2">Confirm New Master Key</label>
                <input type="password" id="mNewSecret2" placeholder="Confirm new Master Key">
            </div>
            <div>
                <label for="mProviderWA">Your WhatsApp Number</label>
                <input id="mProviderWA" placeholder="9198XXXXXXXX">
            </div>
            <div>
                <label for="mProviderUpi">Your UPI ID</label>
                <input id="mProviderUpi" placeholder="yourname@upi">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--border-col);">
            <button class="secondaryBtn" onclick="document.getElementById('securityModal').classList.remove('show')">Cancel</button>
            <button class="primaryBtn" onclick="saveMasterConfig()">Save Settings</button>
        </div>
    </div>
</div>

<script>
let TENANTS = [];
let MASTER_SECRET = "";
let PROVIDER_WA = "";
let PROVIDER_UPI = "";
let masterIdleTimer = null;
let masterIdleEventsBound = false;

function resetMasterIdleTimer() {
    clearTimeout(masterIdleTimer);
    masterIdleTimer = setTimeout(() => {
        MASTER_SECRET = "";
        TENANTS = [];
        document.getElementById("masterSecretInput").value = "";
        document.getElementById("tenantGrid").innerHTML = "";
        document.getElementById("saasStats").innerHTML = "";
        document.getElementById("masterLogin").style.display = "flex";
    }, 15 * 60 * 1000);
}

document.addEventListener("DOMContentLoaded", () => {
    sessionStorage.removeItem(CONFIG.STORAGE.MASTER_KEY);
    document.getElementById("masterSecretInput").focus();
});

async function unlockMaster() {
    const secret = document.getElementById("masterSecretInput").value.trim();
    if (!secret) return;
    const res = await api("saasList", { secret });
    if (!res || !res.success) {
        sessionStorage.removeItem(CONFIG.STORAGE.MASTER_KEY);
        alert(res?.message || "Invalid Master Key");
        return;
    }
    MASTER_SECRET = secret;
    document.getElementById("masterSecretInput").value = "";
    PROVIDER_WA = res.provider_whatsapp || "";
    PROVIDER_UPI = res.provider_upi || "";
    document.getElementById("masterLogin").style.display = "none";
    TENANTS = res.data || [];
    renderSaasBoard();
    if (!masterIdleEventsBound) {
        ["click", "keydown"].forEach(ev => document.addEventListener(ev, resetMasterIdleTimer));
        masterIdleEventsBound = true;
    }
    resetMasterIdleTimer();
}

async function reloadTenants() {
    const res = await api("saasList", { secret: MASTER_SECRET });
    if (res && res.success) {
        TENANTS = res.data || [];
        renderSaasBoard();
    }
}

function renderSaasBoard() {
    const active = TENANTS.filter(t => t.is_active !== false);
    const mrr = active.reduce((s, t) => s + Number(t.plan_price ?? 499), 0);

    document.getElementById("saasStats").innerHTML = `
        <div class="statCard"><h4>Total Onboarded Clinics</h4><h2>${TENANTS.length}</h2></div>
        <div class="statCard"><h4>Active Subscriptions</h4><h2>${active.length}</h2></div>
        <div class="statCard"><h4>Monthly Recurring Revenue</h4><h2>₹${mrr}</h2></div>
    `;

    const basePath = window.location.pathname.replace(/admin(\.html)?$/i, "");
    document.getElementById("tenantGrid").innerHTML = TENANTS.map(t => {
        const isActive = t.is_active !== false;
        const docs = normalizeDoctorsList(t);
        const patLink = `${basePath}index.html?c=${encodeURIComponent(t.slug)}`;
        const recLink = `${basePath}reception.html?c=${encodeURIComponent(t.slug)}`;
        const docLink = `${basePath}doctor.html?c=${encodeURIComponent(t.slug)}`;
        const tvLink  = `${basePath}index.html?c=${encodeURIComponent(t.slug)}&view=tv`;

        return `
            <div class="tenantCard ${!isActive ? 'paused' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div>
                        <h3 style="font-size:18.5px;font-weight:800;">${escapeHTML(t.clinic_name)}</h3>
                        <code style="color:var(--primary);font-size:12px;font-family:'JetBrains Mono',monospace;">?c=${escapeHTML(t.slug)}</code>
                    </div>
                    <span class="statusPill ${isActive ? 'pillActive' : 'pillPaused'}">${isActive ? "ACTIVE" : "PAUSED"}</span>
                </div>
                <div style="font-size:13px;color:var(--text-secondary);line-height:1.65;">
                    <div>👨‍⚕️ <b>Doctors (${docs.length}):</b> ${escapeHTML(docs.map(d => d.reg_no ? `${d.name} [${d.reg_no}]` : d.name).join(", "))}</div>
                    <div>📞 <b>WhatsApp:</b> ${escapeHTML(t.owner_phone || "-")} &nbsp;•&nbsp; <b>Fee:</b> ₹${t.fee_fresh ?? 500}</div>
                    <div>💳 <b>Plan:</b> ₹${t.plan_price ?? 499}/mo • Valid till: <b style="color:var(--text-main);">${escapeHTML(t.subscription_valid_till || "-")}</b></div>
                </div>
                <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--border-col);">
                    <a class="secondaryBtn" href="${patLink}" target="_blank"><i class="fa-solid fa-mobile-screen"></i> Patient</a>
                    <a class="secondaryBtn" href="${recLink}" target="_blank"><i class="fa-solid fa-desktop"></i> Reception</a>
                    <a class="secondaryBtn" href="${docLink}" target="_blank"><i class="fa-solid fa-user-doctor"></i> Doctor</a>
                    <a class="secondaryBtn" href="${tvLink}" target="_blank"><i class="fa-solid fa-tv"></i> TV</a>
                    <button class="secondaryBtn" onclick="editTenant('${escapeJS(t.slug)}')"><i class="fa-solid fa-pen"></i> Edit / PINs</button>
                    <button class="secondaryBtn" style="border-color:#10b981;color:#059669;" onclick="adminAction('saasExtend','${escapeJS(t.slug)}')">+30 Days</button>
                    <button class="secondaryBtn" style="border-color:${isActive ? '#f59e0b' : '#10b981'};color:${isActive ? '#b45309' : '#059669'};" onclick="adminAction('saasToggle','${escapeJS(t.slug)}')">${isActive ? "Pause" : "Activate"}</button>
                    ${t.slug !== "patidar" ? `<button class="secondaryBtn" style="border-color:#fca5a5;color:#dc2626;" onclick="deleteTenant('${escapeJS(t.slug)}')"><i class="fa-solid fa-trash"></i></button>` : ""}
                </div>
            </div>
        `;
    }).join("");
}

function openTenantModal(t = null) {
    document.getElementById("modalTitle").innerText = t ? `Edit ${t.clinic_name}` : "Onboard New Clinic";
    document.getElementById("tSlug").value = t ? t.slug : "";
    document.getElementById("tSlug").readOnly = Boolean(t);
    document.getElementById("tName").value = t ? t.clinic_name : "";
    const docs = t ? normalizeDoctorsList(t) : [];
    document.getElementById("tDoctors").value = t ? formatDoctorsToText(docs) : "";
    document.getElementById("recPinLabel").innerText = t ? "Reset 6-Digit Reception PIN (Blank = keep)" : "6-Digit Reception PIN *";
    document.getElementById("docPinLabel").innerText = t ? "Reset Default 6-Digit Doctor PIN (Blank = keep)" : "Default 6-Digit Doctor PIN *";
    document.getElementById("tRecPin").value = "";
    document.getElementById("tDocPin").value = "";
    document.getElementById("tPhone").value = t ? (t.owner_phone || "") : "";
    document.getElementById("tUpi").value = t ? (t.upi_id || "") : "";
    document.getElementById("tFee").value = t ? (t.fee_fresh ?? 500) : 500;
    document.getElementById("tPlan").value = t ? (t.plan_price ?? 499) : 499;
    document.getElementById("tTagline").value = t ? (t.tagline || "") : "";
    const d30 = new Date(Date.now() + 30 * 86400000).toISOString().split("T")[0];
    document.getElementById("tValid").value = String(t?.subscription_valid_till || "").substring(0, 10) || d30;
    document.getElementById("tenantModal").classList.add("show");
}

function editTenant(slug) {
    const t = TENANTS.find(x => x.slug === slug);
    if (t) openTenantModal(t);
}

async function saveTenant() {
    const isNew = !document.getElementById("tSlug").readOnly;
    const recPin = document.getElementById("tRecPin").value.trim();
    const docPin = document.getElementById("tDocPin").value.trim();
    if (isNew && (!/^[0-9]{6}$/.test(recPin) || !/^[0-9]{6}$/.test(docPin))) {
        alert("Please enter 6-digit numeric PINs for both Reception and Default Doctor PIN.");
        return;
    }
    const existingClinic = TENANTS.find(x => x.slug === document.getElementById("tSlug").value.trim());
    const doctors = parseDoctorsFromText(document.getElementById("tDoctors").value, normalizeDoctorsList(existingClinic || {}));
    const rawFee = document.getElementById("tFee").value.trim();
    const rawPlan = document.getElementById("tPlan").value.trim();

    const payload = {
        slug: document.getElementById("tSlug").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, ""),
        clinic_name: document.getElementById("tName").value.trim(),
        doctors: doctors,
        rec_pin: recPin,
        doc_pin: docPin,
        owner_phone: document.getElementById("tPhone").value.trim(),
        upi_id: document.getElementById("tUpi").value.trim(),
        fee_fresh: rawFee === "" ? 500 : Number(rawFee),
        plan_price: rawPlan === "" ? 499 : Number(rawPlan),
        subscription_valid_till: document.getElementById("tValid").value,
        tagline: document.getElementById("tTagline").value.trim()
    };
    if (!payload.subscription_valid_till) {
        alert("Choose a subscription valid-till date.");
        return;
    }
    if (!payload.slug || !payload.clinic_name) {
        alert("Enter both URL Slug and Clinic Name.");
        return;
    }
    const res = await api("saasUpsert", { secret: MASTER_SECRET, payload });
    if (res && res.success) {
        document.getElementById("tenantModal").classList.remove("show");
        reloadTenants();
    } else {
        alert(res?.message || "Failed to save clinic");
    }
}

async function adminAction(action, slug) {
    const res = await api(action, { secret: MASTER_SECRET, targetSlug: slug });
    if (!res || !res.success) alert(res?.message || "Action failed");
    reloadTenants();
}

function deleteTenant(slug) {
    const typed = prompt(`Type "${slug}" to permanently delete this clinic:`);
    if (typed === slug) adminAction("saasDelete", slug);
}

function openMasterSecurityModal() {
    document.getElementById("mNewSecret").value = "";
    document.getElementById("mNewSecret2").value = "";
    document.getElementById("mProviderWA").value = PROVIDER_WA;
    document.getElementById("mProviderUpi").value = PROVIDER_UPI;
    document.getElementById("securityModal").classList.add("show");
}

async function saveMasterConfig() {
    const n1 = document.getElementById("mNewSecret").value.trim();
    const n2 = document.getElementById("mNewSecret2").value.trim();
    if (n1 && (n1.length < 16 || n1 !== n2)) {
        alert("Master Key must be at least 16 characters and match confirmation.");
        return;
    }
    const res = await api("saasUpdateMaster", {
        currentSecret: MASTER_SECRET,
        newSecret: n1,
        providerWhatsapp: document.getElementById("mProviderWA").value.trim(),
        providerUpi: document.getElementById("mProviderUpi").value.trim()
    });
    if (res && res.success) {
        if (n1) MASTER_SECRET = n1;
        document.getElementById("securityModal").classList.remove("show");
        alert("Master settings updated.");
        reloadTenants();
    } else {
        alert(res?.message || "Error saving settings");
    }
}
</script>
</body>
</html>
