<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClinicOS Super Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif;}
body{background:#05070f;color:#fff;min-height:100vh;padding:26px;}
.container{max-width:1260px;margin:auto;}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding-bottom:20px;border-bottom:1px solid #1f2940;margin-bottom:24px;}
.header h1{font-size:24px;color:#10b981;}
.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:26px;}
.statCard{background:#0b0f19;border:1px solid #24304d;border-radius:16px;padding:18px;}
.statCard h4{color:#94a3b8;font-size:12.5px;margin-bottom:6px;}
.statCard h2{font-size:28px;color:#10b981;}

.primaryBtn{background:#10b981;color:#05070f;border:none;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer;}
.secondaryBtn{background:#141b2d;color:#fff;border:1px solid #293552;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}

.tenantGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;}
.tenantCard{background:#0b0f19;border:1px solid #24304d;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;}
.tenantCard.paused{border-color:#7f1d1d;opacity:0.82;}
.statusPill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;}
.pillActive{background:#14532d;color:#4ade80;}
.pillPaused{background:#7f1d1d;color:#fca5a5;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalBox{width:640px;max-width:100%;background:#0b0f19;border:1px solid #24304d;border-radius:18px;padding:24px;max-height:90vh;overflow-y:auto;}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.formGrid label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:700;}
.formGrid input,.formGrid select,.formGrid textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #293552;background:#141b2d;color:#fff;}
.full{grid-column:1/3;}

#masterLogin{position:fixed;inset:0;background:#05070f;display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:#0b0f19;border:1px solid #24304d;border-radius:18px;padding:34px;max-width:380px;width:100%;text-align:center;}
.loginCard input{width:100%;padding:13px;border-radius:10px;border:1px solid #293552;background:#141b2d;color:#fff;margin:18px 0;text-align:center;font-size:16px;}
</style>
</head>
<body>

<div id="masterLogin">
    <div class="loginCard">
        <i class="fa-solid fa-crown" style="font-size:36px;color:#10b981;margin-bottom:12px;"></i>
        <h2>SaaS Master Control</h2>
        <p style="font-size:13px;color:#94a3b8;margin-top:4px;">Enter Super Admin Master Key</p>
        <input type="password" id="masterSecretInput" placeholder="••••••••••••" autocomplete="off" onkeyup="if(event.key==='Enter')unlockMaster()">
        <button class="primaryBtn" style="width:100%;" onclick="unlockMaster()">Unlock HQ</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <h1><i class="fa-solid fa-crown"></i> ClinicOS SaaS Super Admin</h1>
            <p style="color:#94a3b8;font-size:13px;margin-top:4px;">Multi-Tenant Clinic Management & Subscriptions</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="secondaryBtn" onclick="openMasterSecurityModal()"><i class="fa-solid fa-key"></i> Master Key & Billing</button>
            <button class="primaryBtn" onclick="openTenantModal()"><i class="fa-solid fa-plus"></i> Onboard New Clinic</button>
        </div>
    </div>

    <div class="statsGrid" id="saasStats"></div>
    <div class="tenantGrid" id="tenantGrid"></div>
</div>

<!-- ONBOARD / EDIT CLINIC MODAL -->
<div class="modal" id="tenantModal">
    <div class="modalBox">
        <h3 id="modalTitle" style="color:#10b981;font-size:20px;">Onboard New Clinic</h3>
        <div class="formGrid">
            <div>
                <label>URL Slug (e.g. vermaclinic)</label>
                <input id="tSlug" placeholder="vermaclinic">
            </div>
            <div>
                <label>Clinic Name</label>
                <input id="tName" placeholder="Dr. Verma Clinic">
            </div>
            <div class="full">
                <label>Doctors in Clinic (Enter one doctor per line — supports 1 or multiple doctors)</label>
                <textarea id="tDoctors" rows="3" placeholder="Dr. Anil Verma (MD Medicine)&#10;Dr. Pooja Verma (Dental)&#10;Dr. Rahul Jain (Child Specialist)"></textarea>
            </div>
            <div>
                <label id="recPinLabel">6-Digit Reception PIN</label>
                <input type="password" id="tRecPin" maxlength="6" placeholder="Choose a private 6-digit PIN" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
            <div>
                <label id="docPinLabel">6-Digit Doctor PIN</label>
                <input type="password" id="tDocPin" maxlength="6" placeholder="Choose a different 6-digit PIN" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
            <div>
                <label>Owner WhatsApp (with 91)</label>
                <input id="tPhone" placeholder="91XXXXXXXXXX">
            </div>
            <div>
                <label>Clinic UPI ID</label>
                <input id="tUpi" placeholder="clinic@ybl">
            </div>
            <div>
                <label>Consultation Fee (₹)</label>
                <input type="number" id="tFee" value="500">
            </div>
            <div>
                <label>Monthly Subscription (₹)</label>
                <input type="number" id="tPlan" value="499">
            </div>
            <div>
                <label>Valid Till Date</label>
                <input type="date" id="tValid">
            </div>
            <div>
                <label>Address / Area</label>
                <input id="tTagline" placeholder="Vijay Nagar, Indore">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
            <button class="secondaryBtn" onclick="document.getElementById('tenantModal').classList.remove('show')">Cancel</button>
            <button class="primaryBtn" onclick="saveTenant()">Save Clinic</button>
        </div>
    </div>
</div>

<!-- MASTER PASSWORD & BILLING MODAL -->
<div class="modal" id="securityModal">
    <div class="modalBox">
        <h3 style="color:#10b981;font-size:20px;">Master Key & Renewal Settings</h3>
        <div class="formGrid">
            <div class="full">
                <label>New Master Key (Min 16 characters — leave blank to keep current)</label>
                <input type="password" id="mNewSecret" placeholder="Enter new Master Key">
            </div>
            <div class="full">
                <label>Confirm New Master Key</label>
                <input type="password" id="mNewSecret2" placeholder="Confirm new Master Key">
            </div>
            <div>
                <label>Your WhatsApp Number</label>
                <input id="mProviderWA" placeholder="91XXXXXXXXXX">
            </div>
            <div>
                <label>Your UPI ID</label>
                <input id="mProviderUpi" placeholder="yourname@upi">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
            <button class="secondaryBtn" onclick="document.getElementById('securityModal').classList.remove('show')">Cancel</button>
            <button class="primaryBtn" onclick="saveMasterConfig()">Save Settings</button>
        </div>
    </div>
</div>

<script>
let TENANTS = [];
let MASTER_SECRET = "";
let PROVIDER_WA = "";
let PROVIDER_UPI = "";
let masterIdleTimer = null;
let masterIdleEventsBound = false;

function resetMasterIdleTimer() {
    clearTimeout(masterIdleTimer);
    masterIdleTimer = setTimeout(() => {
        MASTER_SECRET = "";
        TENANTS = [];
        document.getElementById("masterSecretInput").value = "";
        document.getElementById("tenantGrid").innerHTML = "";
        document.getElementById("saasStats").innerHTML = "";
        document.getElementById("masterLogin").style.display = "flex";
    }, 15 * 60 * 1000);
}

document.addEventListener("DOMContentLoaded", () => {
    sessionStorage.removeItem(CONFIG.STORAGE.MASTER_KEY);
    document.getElementById("masterSecretInput").focus();
});

async function unlockMaster() {
    const secret = document.getElementById("masterSecretInput").value.trim();
    if (!secret) return;
    const res = await api("saasList", { secret });
    if (!res || !res.success) {
        sessionStorage.removeItem(CONFIG.STORAGE.MASTER_KEY);
        alert(res?.message || "Invalid Master Key");
        return;
    }
    MASTER_SECRET = secret;
    document.getElementById("masterSecretInput").value = "";
    PROVIDER_WA = res.provider_whatsapp || "";
    PROVIDER_UPI = res.provider_upi || "";
    document.getElementById("masterLogin").style.display = "none";
    TENANTS = res.data || [];
    renderSaasBoard();
    if (!masterIdleEventsBound) {
        ["click", "keydown"].forEach(ev => document.addEventListener(ev, resetMasterIdleTimer));
        masterIdleEventsBound = true;
    }
    resetMasterIdleTimer();
}

async function reloadTenants() {
    const res = await api("saasList", { secret: MASTER_SECRET });
    if (res && res.success) {
        TENANTS = res.data || [];
        renderSaasBoard();
    }
}

function renderSaasBoard() {
    const active = TENANTS.filter(t => t.is_active !== false);
    const mrr = active.reduce((s, t) => s + Number(t.plan_price ?? 499), 0);

    document.getElementById("saasStats").innerHTML = `
        <div class="statCard"><h4>Total Clinics</h4><h2>${TENANTS.length}</h2></div>
        <div class="statCard"><h4>Active Subscriptions</h4><h2>${active.length}</h2></div>
        <div class="statCard"><h4>Monthly Recurring Revenue</h4><h2>₹${mrr}</h2></div>
    `;

    const basePath = window.location.pathname.replace(/admin(\.html)?$/i, "");
    document.getElementById("tenantGrid").innerHTML = TENANTS.map(t => {
        const isActive = t.is_active !== false;
        const docs = normalizeDoctorsList(t);
        const patLink = `${basePath}index.html?c=${encodeURIComponent(t.slug)}`;
        const recLink = `${basePath}reception.html?c=${encodeURIComponent(t.slug)}`;
        const docLink = `${basePath}doctor.html?c=${encodeURIComponent(t.slug)}`;
        const tvLink  = `${basePath}index.html?c=${encodeURIComponent(t.slug)}&view=tv`;

        return `
            <div class="tenantCard ${!isActive ? 'paused' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div>
                        <h3 style="font-size:19px;">${escapeHTML(t.clinic_name)}</h3>
                        <code style="color:#10b981;font-size:12px;">?c=${escapeHTML(t.slug)}</code>
                    </div>
                    <span class="statusPill ${isActive ? 'pillActive' : 'pillPaused'}">${isActive ? "ACTIVE" : "PAUSED"}</span>
                </div>
                <div style="font-size:13px;color:#94a3b8;line-height:1.65;">
                    <div>👨‍⚕️ <b>Doctors (${docs.length}):</b> ${escapeHTML(docs.map(d => d.name).join(", "))}</div>
                    <div>📞 <b>WhatsApp:</b> ${escapeHTML(t.owner_phone || "-")}</div>
                    <div>💳 <b>Plan:</b> ₹${t.plan_price ?? 499}/mo • Valid till: <b style="color:#fff;">${escapeHTML(t.subscription_valid_till || "-")}</b></div>
                </div>
                <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid #1f2940;">
                    <a class="secondaryBtn" href="${patLink}" target="_blank">Patient Portal</a>
                    <a class="secondaryBtn" href="${recLink}" target="_blank">Reception</a>
                    <a class="secondaryBtn" href="${docLink}" target="_blank">Doctor</a>
                    <a class="secondaryBtn" href="${tvLink}" target="_blank">TV</a>
                    <button class="secondaryBtn" onclick="editTenant('${escapeJS(t.slug)}')">Edit / PINs</button>
                    <button class="secondaryBtn" style="border-color:#16a34a;color:#4ade80;" onclick="adminAction('saasExtend','${escapeJS(t.slug)}')">+30 Days</button>
                    <button class="secondaryBtn" style="border-color:${isActive ? '#d97706' : '#16a34a'};color:${isActive ? '#fbbf24' : '#4ade80'};" onclick="adminAction('saasToggle','${escapeJS(t.slug)}')">${isActive ? "Pause" : "Activate"}</button>
                    ${t.slug !== "patidar" ? `<button class="secondaryBtn" style="border-color:#7f1d1d;color:#f87171;" onclick="deleteTenant('${escapeJS(t.slug)}')"><i class="fa-solid fa-trash"></i></button>` : ""}
                </div>
            </div>
        `;
    }).join("");
}

function openTenantModal(t = null) {
    document.getElementById("modalTitle").innerText = t ? `Edit ${t.clinic_name}` : "Onboard New Clinic";
    document.getElementById("tSlug").value = t ? t.slug : "";
    document.getElementById("tSlug").readOnly = Boolean(t);
    document.getElementById("tName").value = t ? t.clinic_name : "";
    const docs = t ? normalizeDoctorsList(t) : [];
    document.getElementById("tDoctors").value = t ? formatDoctorsToText(docs) : "";
    document.getElementById("recPinLabel").innerText = t ? "Reset 6-Digit Reception PIN (Blank = keep)" : "6-Digit Reception PIN *";
    document.getElementById("docPinLabel").innerText = t ? "Reset 6-Digit Doctor PIN (Blank = keep)" : "6-Digit Doctor PIN *";
    document.getElementById("tRecPin").value = "";
    document.getElementById("tDocPin").value = "";
    document.getElementById("tPhone").value = t ? (t.owner_phone || "") : "";
    document.getElementById("tUpi").value = t ? (t.upi_id || "") : "";
    document.getElementById("tFee").value = t ? (t.fee_fresh || 500) : 500;
    document.getElementById("tPlan").value = t ? (t.plan_price ?? 499) : 499;
    document.getElementById("tTagline").value = t ? (t.tagline || "") : "";
    const d30 = new Date(Date.now() + 30 * 86400000).toISOString().split("T")[0];
    document.getElementById("tValid").value = String(t?.subscription_valid_till || "").substring(0, 10) || d30;
    document.getElementById("tenantModal").classList.add("show");
}

function editTenant(slug) {
    const t = TENANTS.find(x => x.slug === slug);
    if (t) openTenantModal(t);
}

async function saveTenant() {
    const isNew = !document.getElementById("tSlug").readOnly;
    const recPin = document.getElementById("tRecPin").value.trim();
    const docPin = document.getElementById("tDocPin").value.trim();
    if (isNew && (!/^[0-9]{6}$/.test(recPin) || !/^[0-9]{6}$/.test(docPin))) {
        alert("Please enter 6-digit numeric PINs for both Reception and Doctor.");
        return;
    }
    const doctors = parseDoctorsFromText(document.getElementById("tDoctors").value);
    const payload = {
        slug: document.getElementById("tSlug").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, ""),
        clinic_name: document.getElementById("tName").value.trim(),
        doctors: doctors,
        doc1_name: doctors[0]?.name || "Doctor 1",
        doc2_name: doctors[1]?.name || "",
        rec_pin: recPin,
        doc_pin: docPin,
        owner_phone: document.getElementById("tPhone").value.trim(),
        upi_id: document.getElementById("tUpi").value.trim(),
        fee_fresh: Number(document.getElementById("tFee").value || 500),
        plan_price: Number(document.getElementById("tPlan").value || 499),
        subscription_valid_till: document.getElementById("tValid").value,
        tagline: document.getElementById("tTagline").value.trim(),
    };
    if (!payload.slug || !payload.clinic_name) {
        alert("Enter both URL Slug and Clinic Name.");
        return;
    }
    const res = await api("saasUpsert", { secret: MASTER_SECRET, payload });
    if (res && res.success) {
        document.getElementById("tenantModal").classList.remove("show");
        reloadTenants();
    } else alert(res?.message || "Failed to save clinic");
}

async function adminAction(action, slug) {
    const res = await api(action, { secret: MASTER_SECRET, targetSlug: slug });
    if (!res || !res.success) alert(res?.message || "Action failed");
    reloadTenants();
}

function deleteTenant(slug) {
    const typed = prompt(`Type "${slug}" to permanently delete this clinic:`);
    if (typed === slug) adminAction("saasDelete", slug);
}

function openMasterSecurityModal() {
    document.getElementById("mNewSecret").value = "";
    document.getElementById("mNewSecret2").value = "";
    document.getElementById("mProviderWA").value = PROVIDER_WA;
    document.getElementById("mProviderUpi").value = PROVIDER_UPI;
    document.getElementById("securityModal").classList.add("show");
}

async function saveMasterConfig() {
    const n1 = document.getElementById("mNewSecret").value.trim();
    const n2 = document.getElementById("mNewSecret2").value.trim();
    if (n1 && (n1.length < 16 || n1 !== n2)) {
        alert("Master Key must be at least 16 characters and match.");
        return;
    }
    const res = await api("saasUpdateMaster", {
        currentSecret: MASTER_SECRET,
        newSecret: n1,
        providerWhatsapp: document.getElementById("mProviderWA").value.trim(),
        providerUpi: document.getElementById("mProviderUpi").value.trim()
    });
    if (res && res.success) {
        if (n1) {
            MASTER_SECRET = n1;
        }
        document.getElementById("securityModal").classList.remove("show");
        alert("Settings saved.");
        reloadTenants();
    } else alert(res?.message || "Error");
}
</script>
</body>
</html>
