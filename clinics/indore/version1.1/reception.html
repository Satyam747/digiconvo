<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://wmuihwywxetbzrrjzspm.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reception Desk — ClinicOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261113-6"></script>
<script src="common.js?v=20261113-6"></script>
<style>
:root{
    --primary:#059669;
    --primary-light:#ecfdf5;
    --accent:#10b981;
    --bg-page:#f1f5f9;
    --bg-surface:#ffffff;
    --bg-muted:#f8fafc;
    --text-main:#0f172a;
    --text-secondary:#475569;
    --text-muted:#64748b;
    --border-col:#e2e8f0;
    --shadow-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
    --shadow-md:0 10px 25px -5px rgba(15,23,42,0.08),0 8px 10px -6px rgba(15,23,42,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;}
body{background:var(--bg-page);color:var(--text-main);min-height:100vh;}

/* TOP NAVIGATION BAR */
.topbar{background:var(--bg-surface);border-bottom:1px solid var(--border-col);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
.brandTitle{font-size:18px;font-weight:800;color:var(--text-main);display:flex;align-items:center;gap:10px;}
.brandIcon{width:34px;height:34px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;}
.navLinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.navBtn{background:var(--bg-muted);color:var(--text-main);border:1.5px solid var(--border-col);padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.18s;}
.navBtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}

.peonBanner{background:linear-gradient(90deg,#f59e0b,#d97706);color:#ffffff;padding:11px 22px;font-weight:800;display:none;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 4px 12px rgba(245,158,11,0.25);}
.container{max-width:1240px;margin:0 auto;padding:20px 18px 48px;}

/* PANELS & WALK-IN BAR */
.panel{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.walkinGrid{display:grid;grid-template-columns:1.2fr 1.6fr 0.6fr 0.6fr 1fr 0.9fr 1.1fr;gap:10px;align-items:end;margin-top:12px;}
@media(max-width:920px){.walkinGrid{grid-template-columns:1fr 1fr;}}

label{display:block;font-size:11px;color:var(--text-muted);font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border-col);background:var(--bg-muted);color:var(--text-main);font-size:13.5px;font-weight:600;outline:none;transition:0.18s;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--bg-surface);box-shadow:0 0 0 3px rgba(5,150,105,0.12);}

/* BUTTONS */
.btn{border:none;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.18s;text-decoration:none;}
.btnGreen{background:var(--primary);color:#ffffff;font-weight:800;box-shadow:0 2px 6px rgba(5,150,105,0.25);}
.btnGreen:hover{background:#047857;}
.btnDark{background:var(--bg-muted);color:var(--text-main);border:1.5px solid var(--border-col);}
.btnDark:hover{border-color:var(--primary);color:var(--primary);}
.btnAmber{background:#fef3c7;color:#92400e;border:1.5px solid #fde68a;}
.btnAmber:hover{background:#fde68a;}
.btnRed{background:#fee2e2;color:#b91c1c;border:1.5px solid #fecaca;}
.btnRed:hover{background:#fecaca;}

/* WORKFLOW TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
.tab{padding:11px 18px;border-radius:12px;background:var(--bg-surface);border:1.5px solid var(--border-col);color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:0.18s;display:inline-flex;align-items:center;gap:8px;}
.tab:hover{border-color:#cbd5e1;color:var(--text-main);}
.tab.active{background:var(--primary);color:#ffffff;border-color:var(--primary);font-weight:800;box-shadow:0 4px 12px rgba(5,150,105,0.2);}
.tabBadge{padding:2px 8px;border-radius:99px;font-size:11.5px;font-family:'JetBrains Mono',monospace;background:var(--bg-muted);color:var(--text-main);}
.tab.active .tabBadge{background:rgba(255,255,255,0.22);color:#ffffff;}

/* PATIENT CARDS */
.patientCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:16px;padding:15px 18px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:0.15s;}
.patientCard:hover{border-color:#cbd5e1;}
.patientRow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.tokenChip{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:8px;border:1px solid #a7f3d0;}
.moreBox{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border-col);}
.moreBox.open{display:block;}

/* PIN LOGIN SCREEN */
#loginScreen{position:fixed;inset:0;background:var(--bg-page);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:24px;padding:38px 30px;max-width:390px;width:100%;text-align:center;box-shadow:var(--shadow-md);}
.pinBox{letter-spacing:8px;font-size:24px;font-family:'JetBrains Mono',monospace;text-align:center;margin:20px 0;padding:13px;background:var(--bg-muted);}

/* SETTINGS MODAL */
.modal{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalContent{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:22px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
@media print{body>*:not(#clinicosPrintMount){display:none!important;}}
</style>
</head>
<body>

<!-- 6-DIGIT RECEPTION PIN LOGIN -->
<div id="loginScreen">
    <div class="loginCard">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;">
            <i class="fa-solid fa-desktop"></i>
        </div>
        <h2 id="loginClinicName" style="font-size:22px;font-weight:800;">Reception Desk</h2>
        <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">Enter your 6-digit Reception PIN to unlock</p>
        <input type="password" id="recPinInput" class="pinBox" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')" onkeyup="if(event.key==='Enter')unlockReception()">
        <button class="btn btnGreen" style="width:100%;justify-content:center;padding:14px;font-size:14.5px;" onclick="unlockReception()">
            <i class="fa-solid fa-unlock-keyhole"></i> Unlock Reception Desk
        </button>
    </div>
</div>

<!-- TOP BAR (LINKS ONLY TO DOCTOR CABIN & TV SCREEN) -->
<div class="topbar">
    <div class="brandTitle">
        <div class="brandIcon"><i class="fa-solid fa-hospital"></i></div>
        <div>
            <div id="hdrClinicName">Reception Desk</div>
            <div style="font-size:11.5px;color:var(--text-muted);font-weight:600;">OPD Queue & Daily Collection</div>
        </div>
    </div>
    <div class="navLinks">
        <select id="docDropdown" onchange="switchSelectedDoctorView(this.value)" style="width:auto;min-width:220px;font-weight:700;border-color:var(--primary);background:var(--primary-light);color:#065f46;"></select>
        <select id="opdStatusSelect" onchange="changeOpdStatus(this.value)" style="width:auto;font-weight:700;">
            <option value="running">🟢 OPD Open</option>
            <option value="delayed">🟡 Delayed (+30m)</option>
            <option value="closed">🔴 OPD Closed</option>
        </select>
        <a id="linkDoctorPage" href="doctor.html" class="navBtn"><i class="fa-solid fa-user-doctor"></i> Doctor Cabin</a>
        <a id="linkTvPage" href="index.html?view=tv" target="_blank" class="navBtn"><i class="fa-solid fa-tv"></i> TV Screen</a>
        <button class="navBtn" onclick="openSettingsModal()"><i class="fa-solid fa-sliders"></i> Settings</button>
    </div>
</div>

<!-- CABIN BELL BANNER -->
<div class="peonBanner" id="peonBanner">
    <span><i class="fa-solid fa-bell fa-shake"></i> CABIN ALERT: Doctor is calling staff inside the consultation cabin</span>
    <button class="btn" style="background:#ffffff;color:#92400e;font-weight:800;" onclick="staffMutate('togglePeonBell',{active:false})">Acknowledge ✓</button>
</div>

<div class="container">
    <!-- FAST WALK-IN REGISTRATION BAR -->
    <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <span style="font-size:13.5px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:6px;">
                <i class="fa-solid fa-bolt"></i> Issue Walk-In Token
            </span>
            <span id="returningHint" style="font-size:12px;background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;padding:4px 10px;border-radius:99px;font-weight:700;display:none;"></span>
        </div>
        <div class="walkinGrid">
            <div>
                <label for="wPhone">Mobile (10 digits)</label>
                <input id="wPhone" maxlength="10" placeholder="98XXXXXXXX" oninput="lookupReturningPatient(this.value)">
            </div>
            <div>
                <label for="wName">Patient Full Name</label>
                <input id="wName" placeholder="Enter full name">
            </div>
            <div>
                <label for="wAge">Age</label>
                <input id="wAge" type="number" min="0" max="120" step="1" placeholder="Yrs">
            </div>
            <div>
                <label for="wGender">Gender</label>
                <select id="wGender"><option value="M">M</option><option value="F">F</option><option value="O">O</option></select>
            </div>
            <div>
                <label for="wVisit">Visit Purpose</label>
                <select id="wVisit" onchange="onWalkinVisitChange()">
                    <option value="Fresh">New Visit</option>
                    <option value="Follow-up">Follow-Up (Free)</option>
                    <option value="Report">Report Check</option>
                </select>
            </div>
            <div>
                <label for="wPay">Payment</label>
                <select id="wPay">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Free">Free</option>
                </select>
            </div>
            <div>
                <button class="btn btnGreen" style="width:100%;justify-content:center;padding:11px;" onclick="issueWalkIn()">
                    <i class="fa-solid fa-plus"></i> Issue Token
                </button>
            </div>
        </div>
    </div>

    <!-- 5 WORKFLOW TABS -->
    <div class="tabs">
        <button class="tab active" id="tabBtn-waiting" onclick="setTab('waiting')">
            <i class="fa-solid fa-chair"></i> Waiting Queue <span class="tabBadge" id="cntWait">0</span>
        </button>
        <button class="tab" id="tabBtn-inquiries" onclick="setTab('inquiries')">
            <i class="fa-solid fa-bell"></i> Online Requests <span class="tabBadge" id="cntInq">0</span>
        </button>
        <button class="tab" id="tabBtn-lab" onclick="setTab('lab')">
            <i class="fa-solid fa-flask"></i> In Lab / X-Ray <span class="tabBadge" id="cntLab">0</span>
        </button>
        <button class="tab" id="tabBtn-completed" onclick="setTab('completed')">
            <i class="fa-solid fa-indian-rupee-sign"></i> Today's Collection <span class="tabBadge" id="cntComp">0</span>
        </button>
        <button class="tab" id="tabBtn-recall" onclick="setTab('recall')">
            <i class="fa-solid fa-calendar-check"></i> Follow-Ups Due <span class="tabBadge" id="cntRec">0</span>
        </button>
    </div>

    <div id="tabBody"></div>
</div>

<!-- CLINIC SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modalContent">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-col);">
            <h3 style="color:var(--text-main);font-size:18px;font-weight:800;"><i class="fa-solid fa-sliders" style="color:var(--primary);margin-right:6px;"></i> Clinic Settings & Doctors</h3>
            <button class="btn btnDark" onclick="document.getElementById('settingsModal').classList.remove('show')">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="grid-column:1/3;">
                <label for="sClinicName">Clinic Name</label>
                <input id="sClinicName">
            </div>
            <div style="grid-column:1/3;">
                <label for="sDoctorsList">Doctors List (Format per line: Doctor Name | Reg. No.)</label>
                <textarea id="sDoctorsList" rows="4" placeholder="Dr. Rajesh Patidar (MS Ortho) | MPMC-14892&#10;Dr. Neha Patidar (MDS Dental) | MPDC-8821"></textarea>
            </div>
            <div>
                <label for="sFeeFresh">New Visit Fee (₹)</label>
                <input id="sFeeFresh" type="number" min="0" step="1">
            </div>
            <div>
                <label for="sFeeReport">Report Check Fee (₹)</label>
                <input id="sFeeReport" type="number" min="0" step="1">
            </div>
            <div>
                <label for="sUpi">Clinic UPI ID</label>
                <input id="sUpi" placeholder="clinic@ybl">
            </div>
            <div>
                <label for="sWa">Clinic WhatsApp Number</label>
                <input id="sWa" placeholder="9198XXXXXXXX">
            </div>
            <div style="grid-column:1/3;">
                <label for="sNewPin">Change 6-Digit Reception PIN (Leave blank to keep current)</label>
                <input type="password" id="sNewPin" maxlength="6" placeholder="Enter new 6-digit numeric PIN" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border-col);">
            <button class="btn btnDark" onclick="document.getElementById('settingsModal').classList.remove('show')">Cancel</button>
            <button class="btn btnGreen" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>
</div>

<script>
let STATE = null;
let SELECTED_DOCTOR = "";
let ACTIVE_TAB = "waiting";
let OPEN_DRAWERS = {};
let receptionRefreshTimer = null;

document.addEventListener("DOMContentLoaded", () => {
    const slug = encodeURIComponent(CONFIG.TENANT.SLUG);
    document.getElementById("linkDoctorPage").href = `doctor.html?c=${slug}`;
    document.getElementById("linkTvPage").href = `index.html?c=${slug}&view=tv`;

    if (sessionStorage.getItem(CONFIG.STORAGE.RECEPTION_PIN)) startReception();
    window.addEventListener("storage", () => {
        if (sessionStorage.getItem(CONFIG.STORAGE.RECEPTION_PIN)) loadDashboard();
    });
});

async function unlockReception() {
    const pin = document.getElementById("recPinInput").value.trim();
    if (!/^[0-9]{6}$/.test(pin)) {
        alert("Please enter a 6-digit numeric Reception PIN.");
        return;
    }
    const res = await api("verifyReceptionPin", { pin });
    if (!res || !res.success) {
        sessionStorage.removeItem(CONFIG.STORAGE.RECEPTION_PIN);
        alert(res?.message || "Incorrect 6-digit PIN");
        return;
    }
    sessionStorage.setItem(CONFIG.STORAGE.RECEPTION_PIN, res.token);
    document.getElementById("recPinInput").value = "";
    startReception();
}

let autoLockStarted = false;
function startReception() {
    document.getElementById("loginScreen").style.display = "none";
    if (!autoLockStarted) {
        initInactivityAutoLock(CONFIG.STORAGE.RECEPTION_PIN);
        autoLockStarted = true;
    }
    loadDashboard();
    if (!receptionRefreshTimer) receptionRefreshTimer = setInterval(loadDashboard, 5000);
}

function relockReception() {
    sessionStorage.removeItem(CONFIG.STORAGE.RECEPTION_PIN);
    clearInterval(receptionRefreshTimer);
    receptionRefreshTimer = null;
    STATE = null;
    document.getElementById("loginScreen").style.display = "flex";
}

async function loadDashboard() {
    const res = await api("getStaffDashboard", { role: "reception" });
    if (!res || !res.success) {
        if (res && /PIN|paused|expired|Session|unauthorized/i.test(res.message || "")) relockReception();
        return;
    }
    STATE = res.clinic;
    renderReception();
}

async function staffMutate(op, payload) {
    const res = await api("staffAction", { role: "reception", op, payload });
    if (res && res.success) {
        STATE = res.clinic;
        renderReception();
    } else {
        alert(res?.message || "Action could not be completed.");
    }
    return res;
}

function renderReception() {
    const c = STATE;
    if (!c) return;

    // Pause DOM re-render if receptionist is actively typing inside a vitals input field
    const ae = document.activeElement;
    if (ae && document.getElementById("tabBody").contains(ae) && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)) return;

    const docs = normalizeDoctorsList(c);
    if (!SELECTED_DOCTOR || !docs.some(d => d.id === SELECTED_DOCTOR)) {
        SELECTED_DOCTOR = docs[0].id;
    }

    document.title = `${c.clinic_name} — Reception Desk`;
    document.getElementById("hdrClinicName").innerText = c.clinic_name;
    document.getElementById("peonBanner").style.display = c.peon_bell ? "flex" : "none";
    document.getElementById("opdStatusSelect").value = c.opd_status || "running";

    // Populate Multi-Doctor Filter Dropdown (Local to Reception Desk)
    const docSel = document.getElementById("docDropdown");
    setOptionsIfChanged(docSel, docs.map(d =>
        `<option value="${escapeHTML(d.id)}" ${d.id === SELECTED_DOCTOR ? "selected" : ""}>👨‍⚕️ ${escapeHTML(d.name)}</option>`
    ).join(""));

    const docTokens = (c.tokens || []).filter(t => (t.doctor || docs[0].id) === SELECTED_DOCTOR);
    const inside = docTokens.find(t => t.status === "inside");
    const inq = docTokens.filter(t => t.status === "inquiry");
    const wait = docTokens.filter(t => t.status === "waiting").sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0) || (a.token || 999) - (b.token || 999));
    const lab = docTokens.filter(t => t.status === "lab");

    const isToday = value => {
        const date = value ? new Date(value) : null;
        return date && !Number.isNaN(date.getTime()) && date.toDateString() === new Date().toDateString();
    };
    const comp = docTokens.filter(t => t.status === "completed" && isToday(t.completed_at));
    const rec = docTokens
        .filter(t => t.status === "completed" && !t.recall_completed_at && t.recall_due_date && new Date(t.recall_due_date).getTime() <= Date.now())
        .map(t => ({ ...t, reason: `Prescribed ${t.recall_days || 5}-day follow-up due` }));

    document.getElementById("cntWait").innerText = wait.length;
    document.getElementById("cntInq").innerText = inq.length;
    document.getElementById("cntLab").innerText = lab.length;
    document.getElementById("cntComp").innerText = comp.length;
    document.getElementById("cntRec").innerText = rec.length;

    const box = document.getElementById("tabBody");

    const insideBanner = inside ? `
        <div class="panel" style="background:var(--primary-light);border:1.5px solid #6ee7b7;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div>
                <span style="font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;">Currently Inside Cabin</span>
                <div style="font-size:17px;font-weight:800;color:var(--text-main);margin-top:2px;">Token #${inside.token} — ${escapeHTML(inside.name)} (${inside.age}${escapeHTML(inside.gender)})</div>
            </div>
            <button class="btn btnGreen" onclick="announceTokenVoiceHindi(${inside.token}, '${escapeJS(inside.name)}')">
                <i class="fa-solid fa-volume-high"></i> Announce Token Again
            </button>
        </div>
    ` : "";

    if (ACTIVE_TAB === "waiting") {
        box.innerHTML = insideBanner + (wait.length === 0 ? `<div class="patientCard" style="color:var(--text-muted);text-align:center;padding:28px;">No patients waiting in queue for this doctor.</div>` : wait.map(w => {
            const turnAlertUrl = buildWhatsAppUrl(w.phone, `Namaste ${w.name} ji, your Token #${w.token} at ${c.clinic_name} will be called shortly. Please be ready at the clinic.`);
            return `
            <div class="patientCard">
                <div class="patientRow">
                    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span class="tokenChip">#${w.token}</span>
                        <div>
                            <b style="font-size:15px;">${escapeHTML(w.name)} (${w.age}${escapeHTML(w.gender)})</b>
                            <span style="color:var(--text-secondary);font-size:13px;"> • ${escapeHTML(w.visit_type)} ₹${w.fee} (${escapeHTML(w.pay_mode)})</span>
                            ${w.vip ? `<span style="background:#ffedd5;color:#9a3412;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-left:6px;">⚡ Priority</span>` : ""}
                        </div>
                    </div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn ${w.arrived ? 'btnGreen' : 'btnAmber'}" onclick="staffMutate('toggleArrived',{id:'${escapeJS(w.id)}'})">
                            ${w.arrived ? '<i class="fa-solid fa-check"></i> Present' : '<i class="fa-regular fa-clock"></i> Mark Present'}
                        </button>
                        <button class="btn btnGreen" onclick="sendInsideCabin('${escapeJS(w.id)}', ${w.token}, '${escapeJS(w.name)}')">
                            <i class="fa-solid fa-door-open"></i> Send to Cabin
                        </button>
                        <a class="btn btnDark" href="${escapeHTML(turnAlertUrl)}" target="_blank" rel="noopener">
                            <i class="fa-brands fa-whatsapp" style="color:#16a34a;"></i> Alert
                        </a>
                        <button class="btn btnDark" onclick="toggleMore('${escapeJS(w.id)}')">
                            Vitals & More <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
                        </button>
                    </div>
                </div>
                <div class="moreBox ${OPEN_DRAWERS[w.id] ? 'open' : ''}">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px;">
                        <div><label>Blood Pressure</label><input id="vBp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.bp || '')}" placeholder="120/80"></div>
                        <div><label>Weight (kg)</label><input id="vWt-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.wt || '')}" placeholder="70"></div>
                        <div><label>Temp (°F)</label><input id="vTp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.temp || '')}" placeholder="98.6"></div>
                        <div><label>SpO2 (%)</label><input id="vSp-${escapeHTML(w.id)}" value="${escapeHTML(w.vitals?.spo2 || '')}" placeholder="99"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                            <button class="btn btnGreen" onclick="saveVitals('${escapeJS(w.id)}')"><i class="fa-solid fa-floppy-disk"></i> Save Vitals</button>
                            <button class="btn btnDark" onclick="staffMutate('parkInLab',{id:'${escapeJS(w.id)}'})"><i class="fa-solid fa-flask"></i> Send to Lab / X-Ray</button>
                            <button class="btn btnDark" onclick="staffMutate('toggleVip',{id:'${escapeJS(w.id)}'})"><i class="fa-solid fa-bolt"></i> Priority Top</button>
                            <button class="btn btnDark" onclick="printThermalTokenSlip(STATE.tokens.find(x=>x.id==='${escapeJS(w.id)}'), STATE)"><i class="fa-solid fa-receipt"></i> Print 58mm Slip</button>
                        </div>
                        <div style="display:flex;gap:6px;align-items:center;">
                            <span style="font-size:11px;font-weight:700;color:var(--text-muted);">Payment:</span>
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'Cash'})">Cash</button>
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'UPI'})">UPI</button>
                            <button class="btn btnDark" onclick="staffMutate('changePayMode',{id:'${escapeJS(w.id)}',pay_mode:'Free'})">Free</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join(""));
    } else if (ACTIVE_TAB === "inquiries") {
        box.innerHTML = inq.length === 0 ? `<div class="patientCard" style="color:var(--text-muted);text-align:center;padding:28px;">No pending online requests for this doctor.</div>` : inq.map(i => `
            <div class="patientCard" style="border-left:4px solid #f59e0b;">
                <div class="patientRow">
                    <div>
                        <b style="font-size:15.5px;">${escapeHTML(i.name)} (${i.age}${escapeHTML(i.gender)})</b>
                        <span style="font-weight:700;color:var(--primary);"> • ${escapeHTML(i.visit_type)} ₹${i.fee}</span>
                        <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px;">
                            <i class="fa-solid fa-mobile-screen"></i> ${escapeHTML(i.phone)} (OTP Verified) • Payment: <b>${escapeHTML(i.pay_mode)}</b>
                            ${i.utr ? ` • UPI UTR Last 4: <b style="color:var(--primary);font-family:'JetBrains Mono',monospace;">${escapeHTML(i.utr)}</b>` : ""}
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btnGreen" onclick="approveRequest('${escapeJS(i.id)}')"><i class="fa-solid fa-check"></i> Approve & Issue Token</button>
                        <button class="btn btnRed" onclick="staffMutate('rejectInquiry',{id:'${escapeJS(i.id)}'})"><i class="fa-solid fa-xmark"></i> Decline</button>
                    </div>
                </div>
            </div>
        `).join("");
    } else if (ACTIVE_TAB === "lab") {
        box.innerHTML = lab.length === 0 ? `<div class="patientCard" style="color:var(--text-muted);text-align:center;padding:28px;">No patients currently parked in Lab / X-Ray.</div>` : lab.map(l => `
            <div class="patientCard" style="border-left:4px solid #0284c7;">
                <div class="patientRow">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="tokenChip">#${l.token}</span>
                        <b>${escapeHTML(l.name)} (${l.age}${escapeHTML(l.gender)})</b>
                    </div>
                    <button class="btn btnGreen" onclick="staffMutate('returnFromLab',{id:'${escapeJS(l.id)}'})">
                        <i class="fa-solid fa-rotate-left"></i> Report Ready — Return to Top of Queue
                    </button>
                </div>
            </div>
        `).join("");
    } else if (ACTIVE_TAB === "completed") {
        const cash = comp.filter(x => x.pay_mode === "Cash").reduce((s, x) => s + Number(x.fee || 0), 0);
        const upi = comp.filter(x => x.pay_mode === "UPI").reduce((s, x) => s + Number(x.fee || 0), 0);
        const free = comp.filter(x => x.pay_mode === "Free" || Number(x.fee) === 0).length;
        const total = cash + upi;
        const docName = getDoctorNameById(c, SELECTED_DOCTOR);
        const summaryWaUrl = buildWhatsAppUrl(
            c.whatsapp_number,
            `*Daily OPD Summary — ${c.clinic_name}*\nDoctor: ${docName}\n• Total Patients: ${comp.length}\n• Cash: ₹${cash}\n• UPI: ₹${upi}\n• Free Follow-ups: ${free}\n• *Total Collection: ₹${total}*`
        );

        box.innerHTML = `
            <div class="panel" style="background:var(--primary-light);border:1.5px solid #6ee7b7;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                <div style="font-size:14px;font-weight:700;color:#065f46;">
                    Patients Seen: <b>${comp.length}</b> &nbsp;|&nbsp; Cash: <b>₹${cash}</b> &nbsp;|&nbsp; UPI: <b>₹${upi}</b> &nbsp;|&nbsp; Free: <b>${free}</b> &nbsp;|&nbsp; Total Collection: <b style="font-size:16px;color:#047857;">₹${total}</b>
                </div>
                <a class="btn btnGreen" href="${escapeHTML(summaryWaUrl)}" target="_blank" rel="noopener">
                    <i class="fa-brands fa-whatsapp"></i> Send Daily Hisab on WhatsApp
                </a>
            </div>
        ` + comp.map(x => {
            const receiptUrl = buildWhatsAppUrl(x.phone, `Thank you ${x.name} ji for visiting ${c.clinic_name}. Payment Receipt: ₹${x.fee} (${x.pay_mode}).`);
            return `
            <div class="patientCard">
                <div class="patientRow">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="tokenChip">#${x.token}</span>
                        <div>
                            <b>${escapeHTML(x.name)}</b> • ₹${x.fee} (${escapeHTML(x.pay_mode)})
                            <span style="font-size:12px;color:var(--text-muted);margin-left:6px;">Recall: ${x.recall_days || 5} days</span>
                        </div>
                    </div>
                    <a class="btn btnDark" href="${escapeHTML(receiptUrl)}" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp" style="color:#16a34a;"></i> Send Receipt
                    </a>
                </div>
            </div>`;
        }).join("");
    } else if (ACTIVE_TAB === "recall") {
        box.innerHTML = rec.length === 0 ? `<div class="patientCard" style="color:var(--text-muted);text-align:center;padding:28px;">No follow-ups due today for this doctor.</div>` : rec.map(r => {
            const remUrl = buildWhatsAppUrl(r.phone, `Namaste ${r.name} ji, your follow-up visit with ${getDoctorNameById(c, SELECTED_DOCTOR)} at ${c.clinic_name} is due today.`);
            return `
            <div class="patientCard">
                <div class="patientRow">
                    <div>
                        <b>${escapeHTML(r.name)} (${r.age}${escapeHTML(r.gender)})</b> • ${escapeHTML(r.phone)}
                        <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">${escapeHTML(r.reason)}</div>
                    </div>
                    <a class="btn btnGreen" href="${escapeHTML(remUrl)}" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp"></i> Send Follow-Up Reminder
                    </a>
                </div>
            </div>`;
        }).join("");
    }
}

function setTab(t) {
    ACTIVE_TAB = t;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.getElementById("tabBtn-" + t).classList.add("active");
    renderReception();
}

function switchSelectedDoctorView(docId) {
    SELECTED_DOCTOR = docId;
    renderReception();
}

function changeOpdStatus(st) {
    staffMutate("setOpdStatus", { status: st });
}

function toggleMore(id) {
    OPEN_DRAWERS[id] = !OPEN_DRAWERS[id];
    renderReception();
}

function saveVitals(id) {
    staffMutate("saveVitals", {
        id,
        bp: document.getElementById("vBp-" + id).value.trim(),
        wt: document.getElementById("vWt-" + id).value.trim(),
        temp: document.getElementById("vTp-" + id).value.trim(),
        spo2: document.getElementById("vSp-" + id).value.trim()
    });
}

function lookupReturningPatient(val) {
    const clean = val.replace(/\D/g, "");
    document.getElementById("wPhone").value = clean;
    const hint = document.getElementById("returningHint");
    if (clean.length === 10 && STATE?.history_lookup?.[clean]) {
        const h = STATE.history_lookup[clean];
        document.getElementById("wName").value = h.name || "";
        document.getElementById("wAge").value = h.age ?? "";
        document.getElementById("wGender").value = h.gender || "M";
        hint.style.display = "inline-block";
        if (h.eligibleFreeFollowup) {
            hint.innerText = `✓ Visited ${h.daysAgo}d ago — Eligible for Free Follow-up (${h.recallDays}d window)`;
            document.getElementById("wVisit").value = "Follow-up";
            document.getElementById("wPay").value = "Free";
        } else {
            hint.innerText = `Returning patient (Last visit ${h.daysAgo}d ago — Standard visit applies)`;
            document.getElementById("wVisit").value = "Fresh";
            document.getElementById("wPay").value = "Cash";
        }
    } else {
        hint.style.display = "none";
    }
}

function onWalkinVisitChange() {
    if (document.getElementById("wVisit").value === "Follow-up") {
        document.getElementById("wPay").value = "Free";
    } else if (document.getElementById("wPay").value === "Free") {
        document.getElementById("wPay").value = "Cash";
    }
}

async function issueWalkIn() {
    const phone = document.getElementById("wPhone").value.trim();
    const name = document.getElementById("wName").value.trim();
    const age = document.getElementById("wAge").value.trim();
    if (!/^\d{10}$/.test(phone) || !name || !Number.isInteger(Number(age)) || Number(age) < 0 || Number(age) > 120) {
        alert("Enter a 10-digit mobile number, patient full name, and age (0 to 120).");
        return;
    }
    const res = await staffMutate("walkIn", {
        phone,
        name,
        age,
        doctor: SELECTED_DOCTOR,
        gender: document.getElementById("wGender").value,
        visit_type: document.getElementById("wVisit").value,
        pay_mode: document.getElementById("wPay").value
    });
    if (!res || !res.success) return;
    document.getElementById("wPhone").value = "";
    document.getElementById("wName").value = "";
    document.getElementById("wAge").value = "";
    document.getElementById("returningHint").style.display = "none";
}

async function approveRequest(id) {
    const item = STATE.tokens.find(x => x.id === id);
    if (!item) return;
    const paymentConfirmed = item.pay_mode !== "UPI" || confirm("Have you checked your clinic UPI app and confirmed this payment was received?");
    if (item.pay_mode === "UPI" && !paymentConfirmed) return;

    // Open blank window synchronously on click so Safari/Chrome popup blockers never block WhatsApp
    const waPopup = window.open("about:blank", "_blank");
    const res = await staffMutate("approveInquiry", { id, payment_confirmed: paymentConfirmed });
    if (!res || !res.success) {
        if (waPopup) waPopup.close();
        return;
    }
    const updated = STATE.tokens.find(x => x.id === id);
    if (updated && waPopup) {
        const waUrl = buildWhatsAppUrl(
            updated.phone,
            `Your appointment token at ${STATE.clinic_name} with ${getDoctorNameById(STATE, updated.doctor)} is confirmed: Token #${updated.token}.`
        );
        if (waUrl !== "#") waPopup.location.href = waUrl;
        else waPopup.close();
    } else if (waPopup) {
        waPopup.close();
    }
}

async function sendInsideCabin(id, token, name) {
    const res = await staffMutate("sendInside", { id, doctor: SELECTED_DOCTOR });
    if (!res || !res.success) return;
    announceTokenVoiceHindi(token, name);
}

function openSettingsModal() {
    const docs = normalizeDoctorsList(STATE);
    document.getElementById("sClinicName").value = STATE.clinic_name || "";
    document.getElementById("sDoctorsList").value = formatDoctorsToText(docs);
    document.getElementById("sFeeFresh").value = STATE.fee_fresh ?? 500;
    document.getElementById("sFeeReport").value = STATE.fee_report ?? 200;
    document.getElementById("sUpi").value = STATE.upi_id || "";
    document.getElementById("sWa").value = STATE.whatsapp_number || "";
    document.getElementById("sNewPin").value = "";
    document.getElementById("settingsModal").classList.add("show");
}

async function saveSettings() {
    const newPin = document.getElementById("sNewPin").value.trim();
    if (newPin && !/^[0-9]{6}$/.test(newPin)) {
        alert("New Reception PIN must be 6 digits.");
        return;
    }
    const rawFresh = document.getElementById("sFeeFresh").value.trim();
    const rawReport = document.getElementById("sFeeReport").value.trim();
    const feeFresh = rawFresh === "" ? 500 : Number(rawFresh);
    const feeReport = rawReport === "" ? 200 : Number(rawReport);

    const doctors = parseDoctorsFromText(document.getElementById("sDoctorsList").value, normalizeDoctorsList(STATE));
    const res = await staffMutate("saveSettings", {
        clinic_name: document.getElementById("sClinicName").value.trim(),
        doctors: doctors,
        fee_fresh: Number.isFinite(feeFresh) && feeFresh >= 0 ? feeFresh : 500,
        fee_report: Number.isFinite(feeReport) && feeReport >= 0 ? feeReport : 200,
        upi_id: document.getElementById("sUpi").value.trim(),
        whatsapp_number: document.getElementById("sWa").value.trim(),
        new_pin: newPin
    });
    if (res && res.success) {
        document.getElementById("settingsModal").classList.remove("show");
        if (newPin) {
            const lg = await api("verifyReceptionPin", { pin: newPin });
            if (lg && lg.success) sessionStorage.setItem(CONFIG.STORAGE.RECEPTION_PIN, lg.token);
            else relockReception();
        }
    }
}
</script>
</body>
</html>
