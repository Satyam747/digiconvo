<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://wmuihwywxetbzrrjzspm.supabase.co https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Doctor Cabin — ClinicOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=20261125-80"></script>
<script src="common.js?v=20261125-80"></script>
<style>
:root{
    --primary:#059669;
    --primary-light:#ecfdf5;
    --accent:#10b981;
    --bg-page:#f1f5f9;
    --bg-surface:#ffffff;
    --bg-muted:#f8fafc;
    --text-main:#0f172a;
    --text-secondary:#475569;
    --text-muted:#64748b;
    --border-col:#e2e8f0;
    --shadow-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
    --shadow-md:0 10px 25px -5px rgba(15,23,42,0.08),0 8px 10px -6px rgba(15,23,42,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;}
body{background:var(--bg-page);color:var(--text-main);min-height:100vh;}

.topbar{background:var(--bg-surface);border-bottom:1px solid var(--border-col);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
.brandWrap{display:flex;align-items:center;gap:10px;}
.brandIcon{width:36px;height:36px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:17px;}
.navLinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.navBtn{background:var(--bg-muted);color:var(--text-main);border:1.5px solid var(--border-col);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.18s;}
.navBtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}

.wrap{max-width:940px;margin:0 auto;padding:18px 18px 56px;}

.shiftControlStrip{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:16px;padding:11px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-sm);}
.shiftSeg{display:inline-flex;background:var(--bg-muted);padding:4px;border-radius:12px;border:1px solid var(--border-col);gap:4px;}
.shiftSegBtn{border:none;padding:8px 14px;border-radius:9px;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.15s;}
.shiftSegBtn.active{background:var(--primary);color:#ffffff;font-weight:800;box-shadow:0 2px 6px rgba(5,150,105,0.22);}

.cabinCard{background:linear-gradient(135deg,#065f46,#047857);color:#ffffff;border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 12px 28px -8px rgba(5,150,105,0.35);}
.intakeDisplayBox{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);padding:12px 15px;border-radius:14px;font-size:13px;margin-top:12px;}
.intakePills{display:flex;flex-wrap:wrap;gap:8px 16px;}

.actionBar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:18px;}
@media(max-width:720px){.actionBar{grid-template-columns:1fr;}}
.mainBtn{border:none;border-radius:14px;padding:16px 18px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:all 0.18s;box-shadow:var(--shadow-sm);}
.mainBtn:hover{transform:translateY(-1px);}
.mainBtn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
.btnCallNext{background:var(--primary);color:#ffffff;box-shadow:0 6px 16px rgba(5,150,105,0.28);}
.btnCallNext:hover{background:#047857;}
.btnLab{background:#0284c7;color:#ffffff;}
.btnLab:hover{background:#0369a1;}
.btnBell{background:#f59e0b;color:#ffffff;}
.btnBell:hover{background:#d97706;}

.btn{border:none;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:0.15s;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btnGreen{background:var(--primary);color:#ffffff;font-weight:800;}
.btnDark{background:var(--bg-muted);color:var(--text-main);border:1.5px solid var(--border-col);}
.btnAmber{background:#fef3c7;color:#92400e;border:1.5px solid #fde68a;}
.btnRed{background:#fee2e2;color:#b91c1c;border:1.5px solid #fecaca;}

.rxPanel{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
.chip{background:var(--bg-muted);border:1.5px solid var(--border-col);color:var(--text-secondary);padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:0.15s;display:inline-flex;align-items:center;gap:6px;}
.chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.chip.active{background:var(--primary);color:#ffffff;border-color:var(--primary);box-shadow:0 2px 8px rgba(5,150,105,0.22);}
.chip.noFollowActive{background:#475569;color:#ffffff;border-color:#475569;}
.chip.dangerChip{background:#fef2f2;color:#dc2626;border-color:#fecaca;}
.chip.dangerChip:hover{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}

label{display:block;font-size:11.5px;color:var(--text-muted);font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
textarea,input,select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border-col);background:var(--bg-muted);color:var(--text-main);font-size:14px;font-weight:500;outline:none;transition:0.18s;}
textarea:focus,input:focus,select:focus{border-color:var(--primary);background:var(--bg-surface);box-shadow:0 0 0 3px rgba(5,150,105,0.12);}

.compRow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg-muted);border:1px solid var(--border-col);margin-bottom:8px;}
.tokenTag{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:3px 9px;border-radius:7px;border:1px solid #a7f3d0;}

#loginScreen{position:fixed;inset:0;background:var(--bg-page);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.loginCard{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:24px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-md);}
.pinBox{letter-spacing:8px;font-size:23px;font-family:'JetBrains Mono',monospace;text-align:center;margin:6px 0 14px;padding:12px;background:var(--bg-muted);}
.captchaRow{display:flex;align-items:center;gap:8px;margin-top:6px;margin-bottom:16px;}
.captchaImg{height:46px;border-radius:10px;border:1px solid #cbd5e1;background:#f1f5f9;}
.captchaInput{flex:1;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;letter-spacing:3px;text-transform:uppercase;text-align:center;background:#ffffff;}
.turnstileSlot{display:none;justify-content:center;margin:8px 0 14px;min-height:65px;}

.modal{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;}
.modal.show{display:flex;}
.modalContent{background:var(--bg-surface);border:1px solid var(--border-col);border-radius:22px;padding:24px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
@media print{body>*:not(#clinicosPrintMount){display:none!important;}body{background:#fff;}}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="loginCard">
        <div style="width:54px;height:54px;border-radius:16px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;">
            <i class="fa-solid fa-user-doctor"></i>
        </div>
        <h2 id="loginClinicTitle" style="font-size:22px;font-weight:800;">Doctor Cabin Sign-In</h2>
        <p id="loginSubNotice" style="font-size:13px;color:var(--text-muted);margin-top:4px;margin-bottom:16px;">Select your profile, enter your 6-digit PIN & security check</p>

        <div style="text-align:left;margin-bottom:10px;">
            <label for="loginDocSelect">Doctor Profile</label>
            <select id="loginDocSelect" style="font-weight:700;"></select>
        </div>

        <div style="text-align:left;">
            <label for="docPinInput">Personal 6-Digit PIN</label>
            <input type="password" id="docPinInput" class="pinBox" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')" onkeyup="if(event.key==='Enter')unlockDoctor()">
        </div>

        <div id="docLoginCapSvgBox" style="text-align:left;">
            <label for="docLoginCapInput">Security CAPTCHA Code</label>
            <div class="captchaRow">
                <img id="docLoginCapImg" class="captchaImg" alt="CAPTCHA">
                <button type="button" class="btn btnDark" onclick="CaptchaWidget.load('docLoginCap')" style="padding:10px 12px;" title="Refresh CAPTCHA"><i class="fa-solid fa-rotate"></i></button>
                <input id="docLoginCapInput" class="captchaInput" maxlength="6" placeholder="CODE" autocomplete="off" onkeyup="if(event.key==='Enter')unlockDoctor()">
            </div>
        </div>
        <div id="docLoginCapTurnstile" class="turnstileSlot"></div>

        <button class="mainBtn btnCallNext" id="unlockDocBtn" style="width:100%;padding:14px;font-size:14.5px;" onclick="unlockDoctor()">
            <i class="fa-solid fa-unlock-keyhole"></i> Unlock My Cabin
        </button>
    </div>
</div>

<div class="topbar">
    <div class="brandWrap">
        <div class="brandIcon"><i class="fa-solid fa-stethoscope"></i></div>
        <div>
            <div style="font-size:17px;font-weight:800;" id="hdrClinicName">Doctor Cabin</div>
            <div style="font-size:12px;color:var(--primary);font-weight:700;" id="hdrDocIdentity">Loading...</div>
        </div>
    </div>
    <div class="navLinks">
        <button class="navBtn" id="docStatusModalBtn" onclick="openStatusDelayModal()">🟢 OPD Open</button>
        <a id="linkReceptionPage" href="reception.html" class="navBtn"><i class="fa-solid fa-desktop"></i> Reception Desk</a>
        <button class="navBtn" onclick="openDocSettingsModal()"><i class="fa-solid fa-sliders"></i> Profile & Templates</button>
        <button class="navBtn" onclick="relockDoctor()" title="Sign out or switch doctor"><i class="fa-solid fa-right-from-bracket"></i> Switch Doctor</button>
    </div>
</div>

<div class="wrap">
    <div class="shiftControlStrip">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="shiftSeg">
                <button type="button" class="shiftSegBtn" id="segMorning" onclick="switchShift('Morning')">🌅 Morning OPD</button>
                <button type="button" class="shiftSegBtn" id="segEvening" onclick="switchShift('Evening')">🌆 Evening OPD</button>
            </div>
            <span id="hdrTodayDate" style="font-size:12px;font-weight:700;color:var(--text-muted);"></span>
        </div>
        <button type="button" class="btn btnAmber" id="completeShiftBtn" onclick="handleCompleteOrReopenShift()">
            <i class="fa-solid fa-flag-checkered"></i> Complete Morning OPD
        </button>
    </div>

    <div id="statsBar" style="font-size:13.5px;color:var(--text-secondary);margin-bottom:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"></div>

    <div class="cabinCard" id="cabinPatientBox"></div>

    <div class="actionBar">
        <button class="mainBtn btnCallNext" id="callNextBtn" onclick="completeAndCallNext()">
            <i class="fa-solid fa-volume-high"></i> Complete & Call Next Patient
        </button>
        <button class="mainBtn btnLab" id="sendLabBtn" onclick="sendToLab()">
            <i class="fa-solid fa-flask"></i> Send to Lab / X-Ray
        </button>
        <button class="mainBtn btnBell" id="callBellBtn" onclick="callStaffBell()">
            <i class="fa-solid fa-bell"></i> Call Staff
        </button>
    </div>

    <div class="rxPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
            <div>
                <strong style="font-size:16px;color:var(--text-main);"><i class="fa-solid fa-prescription" style="color:var(--primary);margin-right:6px;"></i> Prescription & Clinical Notes</strong>
                <span id="draftSaveIndicator" style="font-size:11.5px;color:var(--text-muted);margin-left:8px;"></span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="chip dangerChip" id="voiceBtn" onclick="toggleVoice()">
                    <i class="fa-solid fa-microphone"></i> Dictate
                </button>
                <select id="voiceLang" style="width:auto;padding:6px 10px;font-size:12.5px;font-weight:700;">
                    <option value="en-IN">English (India)</option>
                    <option value="hi-IN">Hindi (हिंदी)</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <label style="margin:0;">My Quick-Insert Clinical Templates</label>
                <button class="chip" style="padding:3px 9px;font-size:11px;" onclick="openDocSettingsModal()">+ Edit My Templates</button>
            </div>
            <div id="customTemplatesBar" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
        </div>

        <textarea id="rxNotesBox" rows="6" placeholder="Type or dictate clinical findings, diagnosis, investigations, and prescription notes..." oninput="saveRxDraft()"></textarea>

        <div style="display:grid;grid-template-columns:1.25fr 0.9fr 0.65fr;gap:12px;margin-top:16px;align-items:end;">
            <div>
                <label>Follow-Up Recall Window (Select "No Follow-Up" if SOS)</label>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <button type="button" class="chip recallBtn" data-days="0" onclick="setRecall(0)">No Follow-Up</button>
                    <button type="button" class="chip recallBtn" data-days="5" onclick="setRecall(5)">5 Days</button>
                    <button type="button" class="chip recallBtn" data-days="15" onclick="setRecall(15)">15 Days</button>
                    <button type="button" class="chip recallBtn" data-days="30" onclick="setRecall(30)">30 Days</button>
                    <input type="number" id="customRecallInput" min="0" max="365" value="5" style="width:70px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:center;" onchange="setRecall(this.value)">
                    <span style="font-size:12px;color:var(--text-muted);font-weight:600;">days</span>
                </div>
            </div>
            <div>
                <label for="printModeSelect">Prescription Paper Mode</label>
                <select id="printModeSelect" onchange="updatePrintMode(this.value)">
                    <option value="full_header">Full Clinic Header (Plain A4)</option>
                    <option value="preprinted">Pre-Printed Letterhead Pad</option>
                </select>
            </div>
            <div id="marginWrap">
                <label for="marginMmInput">Top Blank (mm)</label>
                <input type="number" id="marginMmInput" min="0" max="100" value="45" onchange="updateLetterheadMargin(this.value)">
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-col);">
            <button class="mainBtn" style="background:#0f172a;color:#ffffff;padding:13px;font-size:14px;" onclick="printRxA4()">
                <i class="fa-solid fa-print"></i> Print Industry A4 Prescription
            </button>
            <button class="mainBtn btnCallNext" style="padding:13px;font-size:14px;" onclick="sendRxWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Send Rx on WhatsApp
            </button>
        </div>
    </div>

    <div class="rxPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <strong style="font-size:15px;color:var(--text-main);">
                <i class="fa-solid fa-circle-check" style="color:var(--primary);margin-right:6px;"></i>
                Completed Consultations — <span id="completedShiftLabel">Evening OPD</span> (Latest on Top)
            </strong>
            <span id="completedShiftCount" style="font-size:12px;font-weight:700;color:var(--text-muted);">0 completed</span>
        </div>
        <div id="completedListBox"></div>
    </div>
</div>

<div class="modal" id="statusDelayModal">
    <div class="modalContent" style="max-width:460px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-col);">
            <h3 style="font-size:17px;font-weight:800;"><i class="fa-solid fa-clock" style="color:var(--primary);margin-right:6px;"></i> My OPD Status & Delay</h3>
            <button class="navBtn" onclick="document.getElementById('statusDelayModal').classList.remove('show')">✕</button>
        </div>
        <p id="statusModalDocName" style="font-size:13.5px;font-weight:700;color:var(--text-secondary);margin-bottom:14px;"></p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
            <button type="button" class="btn btnGreen" style="justify-content:center;padding:12px;" onclick="applyMyOpdStatus('running', 0)">🟢 Mark OPD Open</button>
            <button type="button" class="btn btnRed" style="justify-content:center;padding:12px;" onclick="applyMyOpdStatus('closed', 0)">🔴 Mark Absent / Closed</button>
        </div>

        <div style="background:var(--bg-muted);border:1px solid var(--border-col);border-radius:14px;padding:14px;">
            <label>Set Custom Delay Duration</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
                <button type="button" class="btn btnAmber" onclick="setDelayPreset(15)">15 mins</button>
                <button type="button" class="btn btnAmber" onclick="setDelayPreset(30)">30 mins</button>
                <button type="button" class="btn btnAmber" onclick="setDelayPreset(60)">1 hour</button>
                <button type="button" class="btn btnAmber" onclick="setDelayPreset(120)">2 hours</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <input type="number" id="customDelayMinutesInput" min="5" max="720" value="30" placeholder="Minutes (e.g. 90)" style="font-family:'JetBrains Mono',monospace;font-weight:700;">
                <span style="font-size:12.5px;font-weight:700;color:var(--text-muted);white-space:nowrap;">mins</span>
                <button type="button" class="btn btnGreen" onclick="applyCustomDelay()" style="white-space:nowrap;">Set Delay</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="docSettingsModal">
    <div class="modalContent">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-col);">
            <h3 style="font-size:18px;font-weight:800;"><i class="fa-solid fa-user-doctor" style="color:var(--primary);margin-right:6px;"></i> Doctor Profile & Rx Templates</h3>
            <button class="navBtn" onclick="document.getElementById('docSettingsModal').classList.remove('show')">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:14px;">
            <div>
                <label for="dQualInput">Medical Qualification & Specialization (Printed on Prescriptions)</label>
                <input id="dQualInput" maxlength="120" placeholder="e.g. MBBS, MS (Ophthalmology) — Eye Surgeon">
            </div>
            <div>
                <label for="dRegNoInput">Medical Council Registration Number (Printed on Prescriptions)</label>
                <input id="dRegNoInput" maxlength="60" placeholder="e.g. MPMC Reg. No. 14892">
            </div>
            <div>
                <label for="dTemplatesInput">My Quick-Insert Rx Templates (One line per template)</label>
                <textarea id="dTemplatesInput" rows="5" placeholder="• Advise: Plenty of oral fluids & rest&#10;• Advise: CBC, ESR, RBS & Digital X-Ray&#10;• Warm saline gargles twice daily"></textarea>
            </div>
            <div>
                <label for="dNewPinInput">Change My Personal 6-Digit PIN (Leave blank to keep current)</label>
                <input type="password" id="dNewPinInput" maxlength="6" placeholder="Enter new 6-digit numeric PIN" oninput="this.value=this.value.replace(/\D/g,'')">
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border-col);">
            <button class="navBtn" onclick="document.getElementById('docSettingsModal').classList.remove('show')">Cancel</button>
            <button class="mainBtn btnCallNext" id="saveDocProfileBtn" style="padding:10px 18px;font-size:13.5px;" onclick="saveDoctorProfileSettings()">Save My Settings</button>
        </div>
    </div>
</div>

<script>
let STATE = null;
let SELECTED_SHIFT = getDefaultShiftIST();
let CURRENT_INSIDE = null;
let SELECTED_RECALL = 5;
let recognition = null;
let isDictating = false;

let CABIN_FETCH_SEQ = 0;
let ACTION_BUSY = false;
let rxSaveTimer = null;
let rxDirtyPayload = null;
let rxPendingSaves = 0;
let rxSavePromise = Promise.resolve({ success: true });
let doctorRefreshTimer = null;

document.addEventListener("DOMContentLoaded", async () => {
    const slug = encodeURIComponent(CONFIG.TENANT.SLUG);
    document.getElementById("linkReceptionPage").href = `reception.html?c=${slug}`;
    initAudioAutoUnlock();

    if (!CONFIG.TENANT.SLUG) {
        document.getElementById("loginSubNotice").innerText = "Missing clinic link (?c=slug). Please open from your clinic URL.";
    } else {
        await loadPublicDoctorsForLogin();
    }

    if (sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_PIN)) {
        startDoctor();
    } else {
        CaptchaWidget.load("docLoginCap");
    }
});

async function loadPublicDoctorsForLogin() {

async function unlockDoctor() {
    if (ACTION_BUSY) return;
    const doctorId = document.getElementById("loginDocSelect").value;
    const pin = document.getElementById("docPinInput").value.trim();
    const cap = CaptchaWidget.get("docLoginCap");
    if (!doctorId) { alert("Please select your Doctor profile."); return; }
    if (!/^[0-9]{6}$/.test(pin)) { alert("Please enter your 6-digit numeric PIN."); return; }
    if (!CaptchaWidget.isValid(cap)) {
        alert(cap.mode === "turnstile" ? "Please complete the Cloudflare security check." : "Please enter the security CAPTCHA code.");
        return;
    }

    ACTION_BUSY = true;
    const btn = document.getElementById("unlockDocBtn");
    btn.disabled = true;
    let res;
    try {
        res = await api("verifyDoctorPin", {
            pin,
            doctor_id: doctorId,
            captcha_id: cap.captcha_id,
            captcha_answer: cap.captcha_answer,
            turnstileToken: cap.turnstileToken
        });
    } finally {
        ACTION_BUSY = false;
        btn.disabled = false;
    }

    if (!res || !res.success) {
        sessionStorage.removeItem(CONFIG.STORAGE.DOCTOR_PIN);
        CaptchaWidget.load("docLoginCap");
        alert(res?.message || "Incorrect PIN or security check.");
        return;
    }
    sessionStorage.setItem(CONFIG.STORAGE.DOCTOR_PIN, res.token);
    sessionStorage.setItem(CONFIG.STORAGE.DOCTOR_ID, res.doctor_id || doctorId);
    document.getElementById("docPinInput").value = "";
    startDoctor();
}

let autoLockStarted = false;
function startDoctor() {
    document.getElementById("loginScreen").style.display = "none";
    if (!autoLockStarted) {
        initInactivityAutoLock([CONFIG.STORAGE.DOCTOR_PIN, CONFIG.STORAGE.DOCTOR_ID]);
        autoLockStarted = true;
    }
    loadCabin();
    if (!doctorRefreshTimer) doctorRefreshTimer = setInterval(loadCabin, 5000);
}

async function relockDoctor() {
    clearTimeout(rxSaveTimer);
    rxSaveTimer = null;
    rxDirtyPayload = null;
    if (isDictating && recognition) { try { recognition.stop(); } catch (e) {} }
    const oldTok = sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_PIN);
    sessionStorage.removeItem(CONFIG.STORAGE.DOCTOR_PIN);
    if (oldTok) await api("revokeSession", { token: oldTok, kind: "staff" });
    clearInterval(doctorRefreshTimer);
    doctorRefreshTimer = null;
    STATE = null;
    CURRENT_INSIDE = null;
    loadPublicDoctorsForLogin();
    CaptchaWidget.load("docLoginCap");
    document.getElementById("loginScreen").style.display = "flex";
}

async function loadCabin() {
    const seq = ++CABIN_FETCH_SEQ;
    const res = await api("getStaffDashboard", { role: "doctor" });
    if (seq !== CABIN_FETCH_SEQ) return;

    if (!res || !res.success) {
        if (res && /PIN|paused|expired|Session|unauthorized/i.test(res.message || "")) relockDoctor();
        return;
    }
    STATE = res.clinic;
    renderCabin();
}

async function docMutate(op, payload, options = {}) {
    const isBackgroundDraft = Boolean(options.backgroundDraft);
    if (!isBackgroundDraft) {
        if (ACTION_BUSY) return null;
        ACTION_BUSY = true;
    }
    const seq = ++CABIN_FETCH_SEQ;
    let res = null;
    try {
        res = await api("staffAction", { role: "doctor", op, payload });
        if (res && res.success) {
            STATE = res.clinic;
            renderCabin();
        } else {
            if (!isBackgroundDraft) alert(res?.message || "Action could not be completed.");
            await loadCabin();
        }
    } finally {
        if (!isBackgroundDraft) ACTION_BUSY = false;
    }
    return res;
}

function updateRecallButtonsUI(days) {
    const parsed = days === "" || days === null || days === undefined ? 5 : Number(days);
    const num = Number.isFinite(parsed) ? Math.max(0, Math.min(365, Math.floor(parsed))) : 5;
    SELECTED_RECALL = num;
    const customInput = document.getElementById("customRecallInput");
    if (customInput && document.activeElement !== customInput) customInput.value = num;
    document.querySelectorAll(".recallBtn").forEach(btn => {
        const d = Number(btn.dataset.days);
        btn.classList.toggle("active", d === num && d > 0);
        btn.classList.toggle("noFollowActive", d === num && d === 0);
    });
}

function dispatchRxDraftSave(payload) {
    const ind = document.getElementById("draftSaveIndicator");
    if (ind) ind.innerText = "Saving...";
    rxPendingSaves++;
    const p = docMutate("saveRxDraft", payload, { backgroundDraft: true })
        .then(r => { if (ind && rxPendingSaves <= 1) ind.innerText = r && r.success ? "✓ Saved" : ""; return r; })
        .finally(() => { rxPendingSaves = Math.max(0, rxPendingSaves - 1); });
    rxSavePromise = p;
    return p;
}

async function flushPendingRxSave() {
    if (rxSaveTimer) {
        clearTimeout(rxSaveTimer);
        rxSaveTimer = null;
        if (rxDirtyPayload) {
            const payload = rxDirtyPayload;
            rxDirtyPayload = null;
            const res = await dispatchRxDraftSave(payload);
            if (!res || !res.success) return false;
        }
    }
    if (rxPendingSaves > 0) {
        const prior = await rxSavePromise;
        if (!prior || !prior.success) return false;
    }
    return true;
}

async function switchShift(shift) {
    if (shift === SELECTED_SHIFT) return;
    if (!(await flushPendingRxSave())) return;
    SELECTED_SHIFT = shift;
    renderCabin();
}

async function handleCompleteOrReopenShift() {
    if (ACTION_BUSY) return;
    const myDocId = STATE.authenticated_doctor_id || sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_ID);
    const docObj = getDoctorById(STATE, myDocId);
    const today = STATE.today_ist || getTodayIST();
    const currentShiftStatus = SELECTED_SHIFT === "Morning" ? docObj.morning_status : docObj.evening_status;

    if (!(await flushPendingRxSave())) return;

    if (currentShiftStatus === "completed") {
        if (!confirm(`Reopen ${SELECTED_SHIFT} OPD for today?`)) return;
        const r = await docMutate("reopenShift", { shift: SELECTED_SHIFT });
        if (r && r.success) showToast(`${SELECTED_SHIFT} OPD reopened.`);
        return;
    }

    const unfinished = (STATE.tokens || []).filter(t =>
        t.doctor === myDocId && t.token_day === today && t.shift === SELECTED_SHIFT &&
        ["inquiry", "waiting", "inside", "lab"].includes(t.status)
    );
    const warnMsg = unfinished.length > 0
        ? `⚠️ WARNING: You still have ${unfinished.length} unfinished patient(s) in ${SELECTED_SHIFT} OPD.\n\nProceed to mark them cancelled and close ${SELECTED_SHIFT} OPD?`
        : `Mark ${SELECTED_SHIFT} OPD complete?`;

    if (!confirm(warnMsg)) return;
    const res = await docMutate("completeShift", { shift: SELECTED_SHIFT });
    if (res && res.success) {
        showToast(`${SELECTED_SHIFT} OPD marked complete.`);
        if (SELECTED_SHIFT === "Morning") { SELECTED_SHIFT = "Evening"; renderCabin(); }
    }
}

async function completeAndCallNext() {
    if (ACTION_BUSY) return;
    if (!(await flushPendingRxSave())) return;
    const rx = document.getElementById("rxNotesBox").value;
    const expectedId = CURRENT_INSIDE ? CURRENT_INSIDE.id : "NONE";
    const previousCallTs = STATE?.last_voice_call?.ts;

    const res = await docMutate("completeAndCallNext", {
        shift: SELECTED_SHIFT,
        expected_visit_id: expectedId,
        rx_notes: rx,
        recall_days: SELECTED_RECALL
    });
    if (res && res.success) {
        if (STATE?.last_voice_call && STATE.last_voice_call.ts !== previousCallTs) {
            announceTokenVoiceHindi(STATE.last_voice_call.token, "");
            showToast(`Called Token #${STATE.last_voice_call.token} into cabin.`);
        } else {
            showToast("Consultation completed. No waiting patients left in queue.");
        }
    }
}

async function skipCurrentPatient() {
    if (!CURRENT_INSIDE || ACTION_BUSY) return;
    const p = CURRENT_INSIDE;
    if (!confirm(`Mark Token #${p.token} (${p.name}) as No-Show / Cancelled?`)) return;
    clearTimeout(rxSaveTimer);
    rxSaveTimer = null;
    rxDirtyPayload = null;
    const res = await docMutate("cancelVisit", { id: p.id, expected_visit_id: p.id, reason: "No-show / Skipped inside cabin" });
    if (res && res.success) showToast(`Token #${p.token} marked No-Show / Cancelled.`, "warn");
}

async function sendToLab() {
    if (!CURRENT_INSIDE || ACTION_BUSY) { if (!CURRENT_INSIDE) alert("No active patient inside the cabin."); return; }
    const patientId = CURRENT_INSIDE.id;
    if (!(await flushPendingRxSave())) return;
    const saved = await docMutate("saveRxDraft", { id: patientId, rx_notes: document.getElementById("rxNotesBox").value, recall_days: SELECTED_RECALL });
    if (saved && saved.success) {
        const res = await docMutate("parkInLab", { id: patientId, expected_visit_id: patientId });
        if (res && res.success) showToast("Patient sent to Lab / X-Ray.");
    }
}

async function reAnnounceCurrent() {

async function callStaffBell() {

function addMedicine(line) {

function setRecall(days) { updateRecallButtonsUI(days); if (CURRENT_INSIDE) saveRxDraft(); }

function saveRxDraft() {
    if (!CURRENT_INSIDE) return;
    clearTimeout(rxSaveTimer);
    rxDirtyPayload = { id: CURRENT_INSIDE.id, rx_notes: document.getElementById("rxNotesBox").value, recall_days: SELECTED_RECALL };
    const ind = document.getElementById("draftSaveIndicator");

    rxSaveTimer = setTimeout(() => {
        rxSaveTimer = null;
        if (!rxDirtyPayload) return;
        const payload = rxDirtyPayload;
        rxDirtyPayload = null;
        dispatchRxDraftSave(payload);
    }, 500);
}

function updatePrintMode(mode) {
    if (mode !== "full_header" && mode !== "preprinted") return;
    docMutate("saveSettings", { print_mode: mode });
}

function updateLetterheadMargin(val) {

}

function resetVoiceButton() {
    isDictating = false;
    const btn = document.getElementById("voiceBtn");
    if (btn) btn.innerHTML = `<i class="fa-solid fa-microphone"></i> Dictate`;
}

function toggleVoice() {
    if (!CURRENT_INSIDE) { alert("Call a patient into the cabin first before dictating prescription notes."); return; }
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { alert("Voice dictation requires Chrome or Edge browser."); return; }
    if (isDictating && recognition) { try { recognition.stop(); } catch (e) {} resetVoiceButton(); return; }
    if (!recognition) {
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.onresult = (e) => {
            const text = e.results?.[0]?.[0]?.transcript || "";
            if (text.trim()) addMedicine("• " + text.trim());
            resetVoiceButton();
        };
        recognition.onerror = (e) => {
            resetVoiceButton();
            if (e.error === "not-allowed" || e.error === "service-not-allowed") {
                showToast("Microphone permission denied. Allow mic access in browser settings.", "error");
            } else if (e.error !== "no-speech" && e.error !== "aborted") {
                showToast("Voice dictation error: " + e.error, "warn");
            }
        };
        recognition.onend = () => resetVoiceButton();
    }
    try {
        recognition.lang = document.getElementById("voiceLang").value;
        isDictating = true;
        document.getElementById("voiceBtn").innerText = "⏹ Stop Listening";
        recognition.start();
    } catch (err) {
        resetVoiceButton();
        showToast("Unable to start voice dictation.", "warn");
    }
}

function printRxA4() {

    CURRENT_INSIDE.recall_days = SELECTED_RECALL;

}

function sendRxWhatsApp() {

}

function resendCompletedRxWA(visitId) {

function sendPatientRxWA(patientObj) {
    const myDocId = STATE.authenticated_doctor_id || sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_ID);
    const docObj = getDoctorById(STATE, myDocId);
    const qualLine = [docObj.qualification, docObj.reg_no].filter(Boolean).join(" • ");
    const recallDays = Number(patientObj.recall_days ?? 0);
    const recallLine = recallDays === 0 ? "No follow-up required (SOS)" : `After ${recallDays} days`;
    const visitDate = formatDateLabel(patientObj.token_day || getTodayIST());
    const guardLine = patientObj.guardian_name ? `\n*Father/Guardian:* ${patientObj.guardian_name}` : "";
    const addrLine = patientObj.patient_address ? `\n*Address:* ${patientObj.patient_address}` : "";
    const msg = `*Digital Prescription — ${STATE.clinic_name}*\n*Date:* ${visitDate}\n*Consultant:* ${docObj.name}${qualLine ? ` (${qualLine})` : ""}\n*Patient:* ${patientObj.name} (${patientObj.age}/${patientObj.gender}) • Token #${patientObj.token} (${patientObj.shift} OPD)${guardLine}${addrLine}\n\n*℞ Prescription:*\n${patientObj.rx_notes || "As advised."}\n\n*Follow-Up Advised:* ${recallLine}`;
    openWhatsApp(patientObj.phone, msg);
}

function openStatusDelayModal() {
    const myDocId = STATE.authenticated_doctor_id || sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_ID);
    const docObj = getDoctorById(STATE, myDocId);
    document.getElementById("statusModalDocName").innerText = `Status for: ${docObj.name}`;
    document.getElementById("customDelayMinutesInput").value = docObj.delay_minutes > 0 ? docObj.delay_minutes : 30;
    document.getElementById("statusDelayModal").classList.add("show");
}

function setDelayPreset(mins) { document.getElementById("customDelayMinutesInput").value = mins; applyCustomDelay(); }

async function applyCustomDelay() {
    const mins = Number(document.getElementById("customDelayMinutesInput").value);
    if (!Number.isInteger(mins) || mins < 5 || mins > 720) { alert("Enter a valid delay between 5 and 720 minutes."); return; }
    await applyMyOpdStatus("delayed", mins);
}

async function applyMyOpdStatus(status, delayMinutes) {
    const res = await docMutate("setOpdStatus", { status, delay_minutes: delayMinutes });
    if (res && res.success) {
        document.getElementById("statusDelayModal").classList.remove("show");
        showToast("Your OPD status has been updated.");
    }
}

function openDocSettingsModal() {
    const myDocId = STATE?.authenticated_doctor_id || sessionStorage.getItem(CONFIG.STORAGE.DOCTOR_ID);
    const docObj = getDoctorById(STATE, myDocId);
    document.getElementById("dQualInput").value = docObj.qualification || "";
    document.getElementById("dRegNoInput").value = docObj.reg_no || "";
    document.getElementById("dTemplatesInput").value = (docObj.rx_templates || []).join("\n");
    document.getElementById("dNewPinInput").value = "";
    document.getElementById("docSettingsModal").classList.add("show");
}

async function saveDoctorProfileSettings() {
    const newPin = document.getElementById("dNewPinInput").value.trim();
    if (newPin && !/^[0-9]{6}$/.test(newPin)) { alert("Personal Doctor PIN must be 6 digits."); return; }
    const templates = document.getElementById("dTemplatesInput").value
        .split(/\n+/)
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 25);

    const res = await docMutate("saveSettings", {
        qualification: document.getElementById("dQualInput").value.trim(),
        reg_no: document.getElementById("dRegNoInput").value.trim(),
        rx_templates: templates,
        new_pin: newPin
    });
    if (res && res.success) {
        document.getElementById("docSettingsModal").classList.remove("show");
        showToast(newPin ? "Profile, templates & personal PIN updated!" : "Profile & templates saved!");
    }
}
</script>
</body>
</html>
