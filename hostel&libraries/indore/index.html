<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d1f">
<title>Study Library</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="wrap" style="max-width:660px">
  <div id="head"></div>
  <div id="pass"></div>
  <h3 id="pTitle"></h3>
  <div id="plans" class="grid"></div>
  <h3 id="hTitle"></h3>
  <div id="halls" class="grid"></div>
  <div id="formBox"></div>
  <div id="restoreBox"></div>
  <div id="ts" style="margin:10px 0"></div>
  <a id="wa" class="btn ok full" target="_blank" rel="noopener" hidden>💬 WhatsApp</a>
  <p class="muted" style="text-align:center;margin-top:22px"><a id="staffLink" href="#" style="color:inherit"></a> · <span id="brand"></span><span id="legal"></span></p>
</div>
<script>
const SLUG = CONFIG.TENANT.SLUG, K = CONFIG.STORAGE, esc = escapeHTML;
Object.assign(I18N.en, { plans: "Plans", perMonth: "month", hDay: "h/day", reservedSeat: "Reserved seat", unreservedSeat: "Unreserved seat", eitherSeat: "Reserved or unreserved", anyTime: "any time of day", chooseHours: "Hours per day", term: "Duration", months: "months", total: "Total", valid: "valid till", availOk: "Seats available", addons: "Add-ons", trialNote: "Free trial, valid for today only", from: "from", dayTimeline: "Free seats through the day", legendFree: "plenty", legendFew: "few", legendNone: "full" });
Object.assign(I18N.hi, { plans: "प्लान", perMonth: "महीना", hDay: "घंटे/दिन", reservedSeat: "रिज़र्व्ड सीट", unreservedSeat: "अनरिज़र्व्ड सीट", eitherSeat: "रिज़र्व्ड या अनरिज़र्व्ड", anyTime: "दिन में कभी भी", chooseHours: "रोज़ के घंटे", term: "अवधि", months: "महीने", total: "कुल", valid: "वैधता", availOk: "सीट उपलब्ध है", addons: "ऐड-ऑन", trialNote: "मुफ़्त ट्रायल, सिर्फ़ आज के लिए", from: "शुरू", dayTimeline: "दिन भर खाली सीटें", legendFree: "काफ़ी", legendFew: "कम", legendNone: "भरा" });

let LIB = null, qrTimer = null, installEvt = null, formKey = "", qSeq = 0, qTimer = null, lastQ = null;
const planOf = id => LIB.plans.find(p => p.id === id);
const OF = () => LIB.open_from ?? 360, OT = () => LIB.open_to ?? 1320;
const upiHref = amt => `upi://pay?pa=${encodeURIComponent(LIB.upi_id)}&pn=${encodeURIComponent(LIB.library_name)}&am=${amt}&cu=INR`;
const randHex = () => [...crypto.getRandomValues(new Uint8Array(32))].map(x => x.toString(16).padStart(2, "0")).join("");
const seatLabel = s => ({ reserved: t("reservedSeat"), unreserved: t("unreservedSeat"), either: t("eitherSeat") }[s] || s);
const fromPrice = p => p.price_mode === "rate" ? Math.min(Number(p.rate) * Number(p.hours_min), Number(p.cap) > 0 ? Number(p.cap) : Infinity) : Number(p.monthly);
const hoursLabel = p => p.price_mode === "rate" ? `${hoursText(p.hours_min)}-${hoursText(p.hours_max)} ${t("hDay")}` : `${hoursText(p.hours)} ${t("hDay")}`;
const slotLabel = p => p.mode === "flexible" ? t("anyTime") : (p.starts && p.starts.length ? p.starts.map(s => `${fmtMin(s)}-${fmtMin(s + Math.round(p.hours * 60))}`).join(", ") : `${fmtMin(OF())}-${fmtMin(OT())}`);

/*================ Data ================*/
async function refresh() {
    if (!SLUG) { $("#head").innerHTML = `<div class="card"><b>Open this page with your library link</b><p class="muted">Example: index.html?l=your-library</p></div>`; return; }
    const r = await api("getPublic", { booking_ref: getBookingRef() });
    if (!r.success) { $("#head").innerHTML = `<div class="card"><b>${esc(r.message)}</b></div>`; return; }
    LIB = r; applyTheme(r.theme_color); document.title = r.library_name; setupPwa(); renderAll();
}

/*================ Render ================*/
function renderAll() {
    const open = LIB.is_active && LIB.status !== "closed";
    $("#head").innerHTML = `<div class="card" style="padding:20px"><div class="row sp"><span class="pill ${open ? "ok" : "bad"}">${open ? t("open") : t("closed")}</span>
        <span class="row"><button class="btn alt" style="padding:5px 12px" data-lang="${LANG === "en" ? "hi" : "en"}">${LANG === "en" ? "हिन्दी" : "English"}</button><button id="inst" class="btn alt" style="padding:5px 12px" ${installEvt ? "" : "hidden"}>⬇ ${t("install")}</button></span></div>
        <h1 style="margin:12px 0 4px">${esc(LIB.library_name)}</h1><div class="muted">${esc(LIB.tagline || "")}</div><div class="muted">📍 ${esc(LIB.address || "")}</div></div>`;
    $("#pTitle").textContent = t("plans"); $("#hTitle").textContent = t("dayTimeline");
    $("#plans").innerHTML = LIB.plans.map(p => `<button class="card" data-plan="${esc(p.id)}" style="text-align:left;margin:0;width:100%;color:var(--text);font:inherit;cursor:pointer">
        <div class="row sp"><b>${esc(p.name)}</b><span class="pill ${p.seat === "reserved" ? "" : "warn"}">${esc(seatLabel(p.seat))}</span></div>
        <div class="stat" style="font-size:22px">${t("from")} ${inr(fromPrice(p))}<span class="muted" style="font-size:12px"> / ${t("perMonth")}</span></div><div class="muted">${esc(hoursLabel(p))} · ${esc(slotLabel(p))}</div></button>`).join("") || `<p class="muted">—</p>`;
    $("#halls").innerHTML = LIB.halls.map(h => `<div class="card" style="margin:0"><div class="row sp"><b>${esc(h.name)}</b><span class="muted">${h.seats} ${t("seat").toLowerCase()}</span></div>
        <div style="display:flex;gap:2px;margin-top:10px;height:22px">${h.free.map((f, i) => { const r = h.seats ? f / h.seats : 0; return `<div title="${fmtMin(OF() + i * 30)} · ${f} ${t("free")}" style="flex:1;border-radius:3px;background:var(--${r === 0 ? "bad" : r <= 0.25 ? "warn" : "ok"});opacity:${r === 0 ? 0.9 : 0.35 + 0.65 * r}"></div>`; }).join("")}</div>
        <div class="row sp muted" style="margin-top:4px"><span>${fmtMin(OF())}</span><span>${fmtMin(Math.round((OF() + OT()) / 2))}</span><span>${fmtMin(OT())}</span></div></div>`).join("");
    if (LIB.whatsapp_number) { $("#wa").href = waUrl(LIB.whatsapp_number, `Namaste, I would like to know about ${LIB.library_name}.`); $("#wa").hidden = false; }
    $("#staffLink").href = `desk.html?l=${SLUG}`; $("#staffLink").textContent = t("staff");
    const B = CONFIG.BRAND; $("#brand").textContent = `${B.PRODUCT} by ${B.COMPANY}`;
    $("#legal").innerHTML = [[B.TERMS_URL, "Terms"], [B.PRIVACY_URL, "Privacy"]].filter(x => x[0]).map(x => ` · <a href="${esc(x[0])}" style="color:inherit" rel="noopener">${x[1]}</a>`).join("");
    renderPass(LIB.my_booking);
    const key = [open, !!LIB.my_booking, LANG, JSON.stringify(LIB.plans).length].join("|");
    if (key !== formKey) { const saved = captureForm(); formKey = key; $("#formBox").innerHTML = open && !LIB.my_booking ? formHTML() : ""; $("#restoreBox").innerHTML = !LIB.my_booking ? restoreHTML() : ""; if (open && !LIB.my_booking) { initForm(saved); } }
    initTurnstile();
}

function renderPass(b) {
    clearTimeout(qrTimer);
    if (!b) { $("#pass").innerHTML = ""; return; }
    const slot = b.slot_from != null ? `${fmtMin(b.slot_from)}-${fmtMin(b.slot_to)}` : "";
    if (b.status === "inquiry") { $("#pass").innerHTML = `<div class="card"><div class="muted">${esc(b.masked_name)}</div><h3>⏳ ${t("waiting")}</h3><div class="muted">${esc(b.plan_name || "")} · ${esc(slot)} · ${esc(b.hall)}</div></div>`; return; }
    const d = b.days_left, over = d < 0, pct = Math.max(0, Math.min(100, d / 30 * 100)), price = b.renew_price || b.fee;
    $("#pass").innerHTML = `<div class="card" style="padding:20px"><div class="row sp"><div class="muted">${t("yourPass")} · ${esc(b.masked_name)}</div><span class="pill ${over ? "bad" : b.trial ? "warn" : "ok"}">${b.trial ? "Trial" : over ? "●" : "Active"}</span></div>
        <div class="row" style="gap:16px;margin:14px 0"><div style="width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--${over ? "bad" : "ok"}) ${pct}%,var(--bg-panel) 0);display:grid;place-items:center">
        <div style="width:72px;height:72px;border-radius:50%;background:var(--bg-card);display:grid;place-items:center;text-align:center"><div><div class="stat" style="font-size:24px">${Math.abs(d)}</div><div class="muted" style="font-size:10px">${over ? t("overdue") : t("daysLeft")}</div></div></div></div>
        <div><div class="stat" style="font-size:20px">${b.seat ? t("seat") + " " + b.seat : t("unreservedSeat")}</div><div class="muted">${esc(b.plan_name || "")} · ${esc(slot)}</div><div class="muted">${esc(b.hall)} · ${t("valid")} ${fmtDate(b.valid_till)}</div></div></div>
        <div id="qrBox" style="background:#fff;border-radius:16px;padding:10px;width:fit-content;margin:0 auto"></div><div class="bar" style="margin:10px auto 4px;max-width:200px"><i id="qrBar" style="width:100%"></i></div><div class="muted" style="text-align:center">${t("qrHint")}</div>
        ${b.renewal_pending ? `<p class="pill warn" style="margin-top:12px">⏳ ${t("waiting")}</p>` : LIB.upi_id && price ? `<div class="grid" style="margin-top:14px"><a class="btn alt" href="${esc(upiHref(price))}">${t("payUpi")} · ${inr(price)}</a>
        <input id="r-utr" class="inp" inputmode="numeric" maxlength="4" placeholder="${t("utr")}"><button class="btn" data-act="renew">${t("paidNotify")}</button></div>` : ""}</div>`;
    loadQr();
}
async function loadQr() {
    const r = await api("myQr", { booking_ref: getBookingRef() }), box = $("#qrBox"); if (!box) return;
    if (!r.success) { box.style.display = "none"; return; }
    try {
        if (!window.qrcode) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
        const q = window.qrcode(0, "M"); q.addData(r.code); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 5, margin: 0, scalable: true }); box.firstChild.style.cssText = "width:190px;height:190px;display:block";
    } catch (e) { box.innerHTML = `<code style="color:#000;word-break:break-all">${esc(r.code)}</code>`; }
    const bar = $("#qrBar"); if (bar) { bar.style.transition = "none"; bar.style.width = "100%"; requestAnimationFrame(() => { bar.style.transition = `width ${r.expires_in}s linear`; bar.style.width = "0"; }); }
    qrTimer = setTimeout(loadQr, Math.max(8, r.expires_in - 3) * 1000);
}

/*================ Booking form: choose plan, hours and start time; the price is computed on the server ================*/
function formHTML() {
    return `<div class="card grid" id="formCard"><h3 style="margin:0">${t("reserve")}</h3>
        <select id="f-kind" class="inp"><option value="Trial">${t("optTrial")}</option><option value="Admission">${t("optJoin")}</option></select>
        <input id="f-name" class="inp" placeholder="${t("name")}" autocomplete="name"><input id="f-ph" class="inp" inputmode="tel" maxlength="10" placeholder="${t("phone")}" autocomplete="tel"><input id="f-ex" class="inp" placeholder="${t("exam")}">
        <select id="f-plan" class="inp">${LIB.plans.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select><div id="f-psum" class="muted"></div>
        <div id="f-dyn" class="grid"></div>
        <div id="f-adm" class="grid">
          <select id="f-term" class="inp">${(LIB.terms || [1]).map(x => `<option value="${x}">${x} ${t("months")}${+(LIB.term_discounts || {})[x] ? ` (${LIB.term_discounts[x]}% off)` : ""}</option>`).join("")}</select>
          ${(LIB.addons || []).length ? `<div class="row">${LIB.addons.map(a => `<label class="pill"><input type="checkbox" data-addon="${esc(a.id)}"> ${esc(a.name)}</label>`).join("")}</div>` : ""}
          <select id="f-pm" class="inp"><option value="UPI">${t("payNow")}</option><option value="Cash">${t("payCash")}</option></select>
          <div id="f-upi" class="grid"><a id="upiLink" class="btn alt" href="#">${t("payUpi")}</a><input id="f-utr" class="inp" inputmode="numeric" maxlength="4" placeholder="${t("utr")}"></div></div>
        <div id="f-quote" class="card" style="margin:0"><div class="sk"></div></div>
        <button id="f-go" class="btn" data-act="submit" disabled></button></div>`;
}
function restoreHTML() {
    return `<details class="card"><summary style="cursor:pointer;font-weight:700">${t("restoreTitle")}</summary><div class="grid" style="margin-top:10px">
        <input id="rs-ph" class="inp" inputmode="tel" maxlength="10" placeholder="${t("phone")}"><input id="rs-code" class="inp" inputmode="numeric" maxlength="6" placeholder="${t("restoreCode")}">
        <button class="btn alt" data-act="restore">${t("restoreBtn")}</button></div></details>`;
}
const SAVE_IDS = ["f-kind", "f-name", "f-ph", "f-ex", "f-plan", "f-hall", "f-hours", "f-start", "f-stype", "f-term", "f-pm", "f-utr"];
function captureForm() {
    if (!$("#f-kind")) return null;
    return { v: Object.fromEntries(SAVE_IDS.filter(i => $("#" + i)).map(i => [i, $("#" + i).value])), a: $$("[data-addon]:checked").map(x => x.dataset.addon) };
}
function initForm(saved) {
    if (saved) { SAVE_IDS.slice(0, 5).forEach(i => { if (saved.v[i] != null && $("#" + i)) $("#" + i).value = saved.v[i]; }); }
    fDyn(saved);
    if (saved) { ["f-term", "f-pm", "f-utr"].forEach(i => { if (saved.v[i] != null && $("#" + i)) $("#" + i).value = saved.v[i]; }); $$("[data-addon]").forEach(x => { x.checked = saved.a.includes(x.dataset.addon); }); }
    fSync();
}
function fDyn(saved) {
    const pl = planOf($("#f-plan").value); if (!pl) return;
    const prev = saved ? saved.v : {}, cur = id => ($("#" + id) ? $("#" + id).value : prev[id]);
    const hall = cur("f-hall") || LIB.halls[0].id, len = h => Math.round(h * 60);
    let hours = +pl.hours, h = `<select id="f-hall" class="inp">${LIB.halls.map(x => `<option value="${esc(x.id)}" ${x.id === hall ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>`;
    if (pl.price_mode === "rate") {
        const lo = +pl.hours_min, hi = +pl.hours_max, want = +cur("f-hours"); hours = want >= lo && want <= hi ? want : Math.min(Math.max(5, lo), hi);
        let o = ""; for (let x = lo; x <= hi; x += 0.5) o += `<option value="${x}" ${x === hours ? "selected" : ""}>${hoursText(x)} ${t("hDay")}</option>`; h += `<select id="f-hours" class="inp">${o}</select>`;
    } else h += `<div class="muted">${hoursText(hours)} ${t("hDay")}</div>`;
    if (pl.mode !== "flexible") {
        let list = (pl.starts && pl.starts.length) ? pl.starts.slice() : []; if (!list.length) for (let m = OF(); m + len(hours) <= OT(); m += 30) list.push(m);
        list = list.filter(s => s + len(hours) <= OT()); const want = +cur("f-start"), pick = list.includes(want) ? want : list[0];
        h += `<select id="f-start" class="inp">${list.map(s => `<option value="${s}" ${s === pick ? "selected" : ""}>${fmtMin(s)} - ${fmtMin(s + len(hours))}</option>`).join("")}</select>`;
    } else h += `<div class="muted">${fmtMin(OF())} - ${fmtMin(OT())} · ${t("anyTime")}</div>`;
    if (pl.seat === "either") { const st = cur("f-stype") || "unreserved"; h += `<select id="f-stype" class="inp"><option value="reserved" ${st === "reserved" ? "selected" : ""}>${t("reservedSeat")}</option><option value="unreserved" ${st === "unreserved" ? "selected" : ""}>${t("unreservedSeat")}</option></select>`; }
    $("#f-dyn").innerHTML = h; $("#f-psum").textContent = `${hoursLabel(pl)} · ${seatLabel(pl.seat)}`;
}
function fSync() {
    const trial = $("#f-kind").value === "Trial"; $("#f-adm").hidden = trial; $("#f-upi").hidden = $("#f-pm").value !== "UPI" || !LIB.upi_id; fQuoteSoon();
}
function fRead() {
    const pl = planOf($("#f-plan").value), trial = $("#f-kind").value === "Trial";
    const p = { plan_id: pl.id, hall: $("#f-hall").value, term: trial ? 1 : +$("#f-term").value, addons: trial ? [] : $$("[data-addon]:checked").map(x => x.dataset.addon) };
    if (pl.price_mode === "rate") p.hours = +$("#f-hours").value;
    if (pl.mode !== "flexible") p.start_min = +$("#f-start").value;
    if (pl.seat === "either") p.seat_type = $("#f-stype").value;
    return p;
}
function fQuoteSoon() { clearTimeout(qTimer); qTimer = setTimeout(fQuote, 250); }
async function fQuote() {
    if (!$("#f-quote")) return; const n = ++qSeq, trial = $("#f-kind").value === "Trial", r = await api("quote", { payload: fRead() });
    if (n !== qSeq || !$("#f-quote")) return; lastQ = r.success ? r : null;
    const go = $("#f-go");
    if (!r.success) { $("#f-quote").innerHTML = `<span class="pill bad">${esc(r.message)}</span>`; go.disabled = true; go.textContent = t("send"); return; }
    const total = trial ? 0 : r.total;
    $("#f-quote").innerHTML = (trial ? `<div class="pill warn">${t("trialNote")}</div>` : r.lines.map(l => `<div class="row sp"><span class="muted">${esc(l.label)}</span><span>${l.amount < 0 ? "-" : ""}${inr(Math.abs(l.amount))}</span></div>`).join("")
        + `<div class="row sp" style="margin-top:8px;border-top:1px solid var(--border-col);padding-top:8px"><b>${t("total")}</b><span class="stat" style="font-size:24px">${inr(total)}</span></div><div class="muted">${t("valid")} ${fmtDate(r.valid_till)}</div>`)
        + `<div class="muted" style="margin-top:4px">${fmtMin(r.slot_from)} - ${fmtMin(r.slot_to)}</div>` + (r.available ? `<span class="pill ok">${t("availOk")}</span>` : `<span class="pill bad">${esc(r.availability_message || "")}</span>`);
    if (!trial && LIB.upi_id) $("#upiLink").href = upiHref(r.total);
    go.disabled = false; go.className = "btn " + (r.available ? "" : "alt");
    go.textContent = !r.available ? t("waitBtn") : trial ? t("trialBtn") : `${t("send")} (${inr(total)})`;
}
document.addEventListener("change", e => {
    if (!$("#f-kind")) return;
    if (["f-plan", "f-hall", "f-hours", "f-stype"].includes(e.target.id)) fDyn();
    if (/^f-/.test(e.target.id) || e.target.dataset.addon) fSync();
});

/*================ Actions ================*/
document.addEventListener("click", async e => {
    const lg = e.target.closest("[data-lang]"); if (lg) { setLang(lg.dataset.lang); renderAll(); return; }
    if (e.target.closest("#inst") && installEvt) { installEvt.prompt(); installEvt = null; $("#inst").hidden = true; return; }
    const pc = e.target.closest("[data-plan]"); if (pc && $("#f-plan")) { $("#f-plan").value = pc.dataset.plan; fDyn(); fSync(); $("#formCard").scrollIntoView({ behavior: "smooth" }); return; }
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act;
    if (a === "submit") await withBusy(el, submit); else if (a === "renew") await withBusy(el, renew); else if (a === "restore") await withBusy(el, restore);
});
async function submit() {
    if (!lastQ) return toast(t("verify"));
    const trial = $("#f-kind").value === "Trial", p = fRead();
    const base = { ...p, name: $("#f-name").value.trim(), phone: $("#f-ph").value.replace(/\D/g, ""), exam: $("#f-ex").value.trim() };
    if (!lastQ.available) { const r = await api("joinWaitlist", { payload: base }); toast(r.success ? t("waitSent") : r.message); if (r.success) refresh(); return; }
    const payload = { ...base, kind: trial ? "Trial" : "Admission", pay_mode: trial ? "UPI" : $("#f-pm").value, utr: ($("#f-utr").value || "").replace(/\D/g, ""), booking_ref: getBookingRef() };
    let r = await api("submitBooking", { payload });
    if (!r.success && /already been used/i.test(r.message || "")) { localStorage.removeItem(K.MY_BOOKING_REF); payload.booking_ref = getBookingRef(); r = await api("submitBooking", { payload }); }
    if (!r.success && r.full) { toast(r.message); fQuoteSoon(); return; }
    toast(r.success ? t("sent") : r.message); buzz(r.success ? 20 : [30, 40, 30]); if (r.success) refresh();
}
async function renew() {
    const r = await api("submitRenewal", { booking_ref: getBookingRef(), utr: $("#r-utr").value.replace(/\D/g, "") });
    toast(r.success ? t("sent") : r.message); if (r.success) refresh();
}
async function restore() {
    const nr = randHex(), r = await api("restoreBooking", { phone: $("#rs-ph").value.replace(/\D/g, ""), code: $("#rs-code").value.trim(), new_ref: nr });
    if (r.success) { localStorage.setItem(K.MY_BOOKING_REF, nr); toast("✅ " + t("restoreBtn")); refresh(); } else toast(r.message);
}

/*================ Turnstile, install, PWA ================*/
function initTurnstile() {
    if (!CONFIG.GATE.ENABLED || !CONFIG.GATE.TURNSTILE_SITE_KEY || $("#ts").dataset.ready) return; $("#ts").dataset.ready = "1";
    const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"; s.async = true;
    s.onload = () => { window.turnstile.render("#ts", { sitekey: CONFIG.GATE.TURNSTILE_SITE_KEY, callback: tk => { window.__tsToken = tk; }, "expired-callback": () => { window.__tsToken = ""; } }); };
    document.head.appendChild(s);
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if ($("#inst")) $("#inst").hidden = false; });
function setupPwa() {
    if (setupPwa.done) return; setupPwa.done = true;
    const m = { name: LIB.library_name, short_name: LIB.library_name.slice(0, 12), start_url: location.href, scope: location.href.replace(/[^/]*$/, ""), display: "standalone", background_color: "#0a0d1f", theme_color: "#0a0d1f",
        icons: [192, 512].map(n => ({ src: new URL(`icon-${n}.png`, location.href).href, sizes: `${n}x${n}`, type: "image/png", purpose: "any" })) };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" })); document.head.appendChild(l);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
}

refresh();
setInterval(() => { if (!/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) refresh(); }, 30000);
</script>
